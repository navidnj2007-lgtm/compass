return false;\n  var mm=Math.floor(w.left/60), ss=w.left%60, C=2*Math.PI*54, fresh=true;\n  Array.prototype.forEach.call(cards,function(card){\n    if(card.getAttribute(\"data-seg\")!==String(w.i)){ fresh=false; return; }\n    var n=card.querySelector(\".num b\");\n    if(n) n.textContent = mm+\":\"+String(ss).padStart(2,\"0\");\n    var ring=card.querySelector(\".gauge circle:last-of-type\");\n    if(ring) ring.setAttribute(\"stroke-dashoffset\", C*(w.left/w.len));\n    var pb=card.querySelector(\"[data-fpause]\");\n    if(pb) pb.textContent = t.on?\"Pause\":\"Resume\";\n    /* The strip, the three figures and the paused styling are as live as the\n       clock is — leaving them for the next full repaint is what would make\n       them look broken. */\n    var fill=card.querySelector(\".fseg.cur .fill\");\n    if(fill) fill.style.width = (1-(w.left/w.len))*100+\"%\";\n    var dn=card.querySelector(\"[data-fdone]\"); if(dn) dn.textContent=fHrs(fSessionDone());\n    var lf=card.querySelector(\"[data-fleft]\"); if(lf) lf.textContent=fHrs(Math.round(fLeftTotal()/60));\n    var en=card.querySelector(\"[data-fends]\"); if(en) en.textContent=t.on?fEta(fLeftTotal()):\"\\u2014\";\n    var st=card.querySelector(\"[data-fstate]\");\n    if(st) st.textContent = !t.on ? \"Paused\"\n      : (w.k===\"b\" ? \"Break\" : \"Block \"+fBlockNo(w.i)+\" / \"+fBlocks(t.seg));\n    card.classList.toggle(\"ispaused\", !t.on);\n  });\n  return fresh;\n}\n\n/* ══════════ THE SESSION CARD ══════════\n   The Today tab and the Focus tab show the same session. These two builders\n   are the only place that markup exists, so there is nothing to keep in sync:\n   one engine, one config, one label, one set of controls. `compact` trims the\n   explanatory copy and shrinks the ring for the Today card — the session it\n   describes and starts is identical either way.\n   Controls are addressed by data-attribute, not id, because both cards are in\n   the document at once. */\nvar F_PRESETS=[25,50,90,120,180];\nfunction fSetupHTML(compact){\n  var F=fCfg(), seg=fBuild(F.plan, F.skip), n=fBlocks(seg), br=n-1;\n  var plan = F.skip\n    ? 'One unbroken block of '+fHrs(F.plan)\n    : n+' block'+(n===1?'':'s')+' of about '+Math.round(seg[0].s/60)+' min'\n      +(br? ' · '+br+' break'+(br===1?'':'s') : ' · no break');\n  return '<div class=\"'+(compact?'fSessionBox':'card')+'\" data-fsetup=\"1\">'\n    + (compact ? '' :\n        '<h2>Get ready to focus<\u002Fh2>'\n      + '<div class=\"hint\">Each block is deep work with the phone in another room. Between blocks you get a real '\n      +   'break — away from screens, or it doesn’t count as recovery.<\u002Fdiv>')\n    + '<div class=\"fdial\">'\n    +   '<div class=\"fstep\">'\n    +     '<button class=\"ghost\" data-fminus=\"1\" aria-label=\"Less time\"'+(F.plan<=5?' disabled':'')+'>'+IMINUS+'<\u002Fbutton>'\n    +     '<div class=\"fnum\"><b>'+F.plan+'<\u002Fb><span>mins<\u002Fspan><\u002Fdiv>'\n    +     '<button class=\"ghost\" data-fplus=\"1\" aria-label=\"More time\"'+(F.plan>=480?' disabled':'')+'>'+IPLUS+'<\u002Fbutton>'\n    +   '<\u002Fdiv>'\n    +   '<div class=\"fpre\">'+F_PRESETS.map(function(m){\n          return '<button data-fpre=\"'+m+'\" aria-pressed=\"'+(F.plan===m)+'\">'\n            + (m<60 ? m+'m' : (m/60)+'h') + '<\u002Fbutton>'; }).join(\"\")+'<\u002Fdiv>'\n    +   fMapHTML(seg, null, 0)\n    +   '<div class=\"fplan\">'+plan+'<\u002Fdiv>'\n    +   '<div class=\"fends\">Start now, finish at <b>'+fEta(fSpanSecs(seg))+'<\u002Fb><\u002Fdiv>'\n    + '<\u002Fdiv>'\n    + '<label class=\"fchk\"><input type=\"checkbox\" data-fbreaks=\"1\"'+(F.skip?' checked':'')+'> Skip breaks<\u002Flabel>'\n    + (compact ? '' :\n        '<label class=\"lbl\" style=\"margin-top:14px\">What exactly are you doing?<\u002Flabel>'\n      + '<input class=\"fld sm\" data-flabel=\"1\" placeholder=\"Not “revise Chemistry” — “the 8 equilibrium questions on p.212”\" value=\"'+esc(T().q||\"\")+'\">')\n    + '<label class=\"lbl\" style=\"margin-top:'+(compact?'13':'11')+'px\">Count it towards<\u002Flabel>'\n    + '<div class=\"pills\" data-fsubs=\"1\">'\n    +   '<button data-fsub=\"\" aria-pressed=\"'+(!fPickSub?'true':'false')+'\">Nothing<\u002Fbutton>'\n    +   S.subjects.map(function(x){\n          return '<button data-fsub=\"'+x.id+'\" aria-pressed=\"'+(fPickSub===x.id?'true':'false')+'\">'+esc(x.name)+'<\u002Fbutton>'; }).join(\"\")\n    + '<\u002Fdiv>'\n    + '<button class=\"primary\" data-fgo=\"1\" style=\"width:100%;margin-top:'+(compact?'6':'16')+'px\">'\n    +   (compact ? 'Start '+fHrs(F.plan) : 'Start focus session')+'<\u002Fbutton>'\n    + '<\u002Fdiv>';\n}\nvar fPickSub=null;\n\n/* The clock. Returns \"\" if the session has just run out, so callers know to\n   fall back to the setup card instead of drawing a dead ring. */\nfunction fLiveHTML(compact){\n  var t=S.timer, w=fWhere(fPos());\n  if(w.k===\"end\") return \"\";\n  var mm=Math.floor(w.left/60), ss=w.left%60;\n  var blocks=fBlocks(t.seg), no=fBlockNo(w.i);\n  var onBreak=w.k===\"b\", pct=1-(w.left/w.len), C=2*Math.PI*54;\n  var paused=!t.on;\n  /* Both cards can be in the document at once, so the ring gradient needs an id\n     each rather than one they would fight over. */\n  var gid='fg-'+(compact?'c':'f'), tone=onBreak?\"--d1\":\"--d3\";\n  return '<div class=\"'+(compact?'fSessionBox':'card')+' fLiveCard'\n    +   (onBreak?' onbreak':'')+(paused?' ispaused':'')+'\" data-seg=\"'+w.i+'\">'\n    + '<div class=\"gauge fring '+(compact?'fmid':'fbig')+'\">'\n    +   '<svg viewBox=\"0 0 132 132\" style=\"width:100%;height:100%\">'\n    +     '<defs><linearGradient id=\"'+gid+'\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\">'\n    +       '<stop offset=\"0%\" stop-color=\"var('+tone+')\" stop-opacity=\".5\"/>'\n    +       '<stop offset=\"100%\" stop-color=\"var('+tone+')\"/><\u002FlinearGradient><\u002Fdefs>'\n    +     '<circle cx=\"66\" cy=\"66\" r=\"54\" fill=\"none\" stroke=\"var(--surface-2)\" stroke-width=\"10\"/>'\n    +     '<circle cx=\"66\" cy=\"66\" r=\"54\" fill=\"none\" stroke=\"url(#'+gid+')\" stroke-width=\"10\" stroke-linecap=\"round\"'\n    +       ' stroke-dasharray=\"'+C+'\" stroke-dashoffset=\"'+(C*(1-pct))+'\"/><\u002Fsvg>'\n    +   '<div class=\"num\"><b>'+mm+':'+String(ss).padStart(2,\"0\")+'<\u002Fb>'\n    +     '<span data-fstate=\"1\">'+(paused?\"Paused\":onBreak?\"Break\":\"Block \"+no+\" / \"+blocks)+'<\u002Fspan><\u002Fdiv>'\n    + '<\u002Fdiv>'\n    + '<div class=\"fmeta\">'\n    +   '<div class=\"fwhat\">'+esc(t.label||\"Deep work\")+'<\u002Fdiv>'\n    +   '<div class=\"fsub\">'+(onBreak\n          ? \"Off screens. Walk, stretch, look out of a window — scrolling isn’t a break.\"\n          : \"When you drift, come back without commentary.\")+'<\u002Fdiv>'\n    + '<\u002Fdiv>'\n    + fMapHTML(t.seg, w.i, pct)\n    + '<div class=\"fstats\">'\n    +   '<div><b data-fdone=\"1\">'+fHrs(fSessionDone())+'<\u002Fb><span>Focused<\u002Fspan><\u002Fdiv>'\n    +   '<div><b data-fleft=\"1\">'+fHrs(Math.round(fLeftTotal()/60))+'<\u002Fb><span>Left<\u002Fspan><\u002Fdiv>'\n    +   '<div><b data-fends=\"1\">'+(paused?\"\\u2014\":fEta(fLeftTotal()))+'<\u002Fb><span>Ends<\u002Fspan><\u002Fdiv>'\n    + '<\u002Fdiv>'\n    + '<div class=\"row fbtns\">'\n    +   '<button class=\"primary sm\" data-fpause=\"1\">'+(t.on?\"Pause\":\"Resume\")+'<\u002Fbutton>'\n    +   '<button class=\"ghost sm\" data-fnext=\"1\">'+(onBreak?\"Skip break\":\"End block\")+'<\u002Fbutton>'\n    +   '<button class=\"ghost sm\" data-fend=\"1\">Stop<\u002Fbutton>'\n    + '<\u002Fdiv><\u002Fdiv>';\n}\n\nfunction fBindLive(root){\n  on(root.querySelector(\"[data-fpause]\"),\"click\",function(){ S.timer.on?fPause():fResume(); });\n  on(root.querySelector(\"[data-fnext]\"),\"click\",function(){ fSkip(); fPaint(true); });\n  on(root.querySelector(\"[data-fend]\"),\"click\",function(){ fStop(); });\n}\nfunction fBindSetup(root){\n  var F=fCfg();\n  function bump(d){ F.plan=Math.max(5, Math.min(480, F.plan+d)); touch(); fPaint(true); }\n  on(root.querySelector(\"[data-fminus]\"),\"click\",function(){ bump(F.plan<=60?-5:-15); });\n  on(root.querySelector(\"[data-fplus]\"),\"click\",function(){ bump(F.plan<60?5:15); });\n  each(\"[data-fpre]\",root,function(b){\n    on(b,\"click\",function(){ F.plan=+b.dataset.fpre; touch(); fPaint(true); });\n  });\n  on(root.querySelector(\"[data-fbreaks]\"),\"change\",function(e){ F.skip=e.target.checked; touch(); fPaint(true); });\n  var lab=root.querySelector(\"[data-flabel]\");\n  if(lab) on(lab,\"input\",function(e){\n    T().q=e.target.value; touch();\n    var bq=$(\"#blockQ\"); if(bq && bq!==document.activeElement) bq.value=e.target.value;\n  });\n  each(\"[data-fsub]\",root,function(b){\n    on(b,\"click\",function(){ fPickSub=b.dataset.fsub||null; fPaint(true); });\n  });\n  on(root.querySelector(\"[data-fgo]\"),\"click\",function(){\n    /* The Today card has no label field of its own — the \"one question\" input\n       right beside it is the same field, so either page names the same task. */\n    var box=lab || $(\"#blockQ\");\n    var text=String(box ? box.value : T().q||\"\").trim();\n    if(!text){\n      if(box){ box.focus(); box.placeholder=\"Name the actual task first\"; }\n      return;\n    }\n    T().q=text; touch(); fStartGated(F.plan, text, fPickSub, F.skip);\n  });\n}\n\nfunction fPaintSetup(){\n  var sec=$(\"#s-focus\"); if(!sec) return;\n  var lab=sec.querySelector(\"[data-flabel]\");\n  if(lab && document.activeElement===lab) return;      // he's mid-sentence; leave it alone\n  sec.innerHTML = fSetupHTML(false) + '<div id=\"fStats\"><\u002Fdiv>';\n  fBindSetup(sec);\n}\n\nfunction fPaintLive(){\n  var sec=$(\"#s-focus\"); if(!sec) return;\n  var html=fLiveHTML(false);\n  if(!html) return fPaintSetup();\n  sec.innerHTML = html + '<div id=\"fStats\"><\u002Fdiv>';\n  fBindLive(sec);\n}\n\n/* The same card, compact, on the Today tab. */\nfunction fPaintToday(){\n  var box=$(\"#todayTimer\"); if(!box) return;\n  if(fLive()){\n    var html=fLiveHTML(true);\n    if(html){ box.innerHTML=html; fBindLive(box); return; }\n  }\n  box.innerHTML=fSetupHTML(true); fBindSetup(box);\n}\n\nfunction fPaintStats(){\n  var box=$(\"#fStats\"); if(!box) return;\n  var F=fCfg(), today=fMins(iso(new Date())), yday=fMins(iso(addD(new Date(),-1)));\n  var goal=Math.max(5,F.goal), pct=Math.min(1, today/goal), C=2*Math.PI*54;\n  var ws=wkStart(NOW), days=[], labels=[\"M\",\"T\",\"W\",\"T\",\"F\",\"S\",\"S\"], wk=0;\n  for(var i=0;i<7;i++){ var k=iso(addD(ws,i)); var v=fMins(k); days.push(v); wk+=v; }\n  var mx=Math.max(60, Math.max.apply(null,days.concat([goal])));\n\n  var todayK=iso(new Date());\n  var todayBlocks=F.log.filter(function(e){ return e.d===todayK; }).slice(-8);\n  var bysub={}, wsk=iso(ws);\n  F.log.forEach(function(e){ if(e.d>=wsk && e.s){ bysub[e.s]=(bysub[e.s]||0)+e.m; } });\n  var subRows=Object.keys(bysub).sort(function(a,b){ return bysub[b]-bysub[a]; }).map(function(id){\n    var su=S.subjects.filter(function(x){ return x.id===id; })[0];\n    return '<div class=\"fsr\"><span class=\"dot\" style=\"background:var('+(su?su.c:\"--d1\")+')\"><\u002Fspan>'\n      + '<span class=\"nm\">'+esc(su?su.name:\"Other\")+'<\u002Fspan><b>'+fHrs(bysub[id])+'<\u002Fb><\u002Fdiv>';\n  }).join(\"\");\n\n  box.innerHTML = '<div class=\"card\">'\n    + '<div class=\"spread\" style=\"margin-bottom:14px\"><h2>Daily progress<\u002Fh2>'\n    +   '<button class=\"ghost sm\" id=\"fGoalEdit\">Goal: '+fHrs(goal)+'<\u002Fbutton><\u002Fdiv>'\n    + '<div class=\"frow\">'\n    +   '<div class=\"fcol\"><b>'+fHrs(yday)+'<\u002Fb><span>Yesterday<\u002Fspan><\u002Fdiv>'\n    +   '<div class=\"gauge\">'\n    +     '<svg viewBox=\"0 0 132 132\" style=\"width:100%;height:100%\">'\n    +       '<circle cx=\"66\" cy=\"66\" r=\"54\" fill=\"none\" stroke=\"var(--surface-2)\" stroke-width=\"11\"/>'\n    +       '<circle cx=\"66\" cy=\"66\" r=\"54\" fill=\"none\" stroke=\"var(--d3)\" stroke-width=\"11\" stroke-linecap=\"round\"'\n    +         ' stroke-dasharray=\"'+C+'\" stroke-dashoffset=\"'+(C*(1-pct))+'\" style=\"transition:stroke-dashoffset .6s cubic-bezier(.4,0,.2,1)\"/><\u002Fsvg>'\n    +     '<div class=\"num\"><b>'+Math.round(pct*100)+'%<\u002Fb><span>Of goal<\u002Fspan><\u002Fdiv><\u002Fdiv>'\n    +   '<div class=\"fcol\"><b>'+fStreak()+'<\u002Fb><span>Day streak<\u002Fspan><\u002Fdiv>'\n    + '<\u002Fdiv>'\n    + '<div class=\"fdone\">Focused today: <b>'+fHrs(today)+'<\u002Fb>'+(today>=goal?' · goal met':'')+'<\u002Fdiv>'\n    + (todayBlocks.length ? '<div class=\"fblocks\">'+todayBlocks.map(function(e){\n        return '<div class=\"fbl\"><span class=\"m\">'+fHrs(e.m)+'<\u002Fspan>'\n          + '<span class=\"t\">'+esc(e.t||\"Deep work\")+'<\u002Fspan>'\n          + '<button class=\"gx\" data-funlog=\"'+e.at+'\" aria-label=\"Remove this block\">×<\u002Fbutton><\u002Fdiv>';\n      }).join(\"\")+'<\u002Fdiv>' : '')\n    + '<\u002Fdiv>'\n    + '<div class=\"card\">'\n    +   '<div class=\"spread\" style=\"margin-bottom:4px\"><h2>This week<\u002Fh2><span class=\"src\">'+fHrs(wk)+' total<\u002Fspan><\u002Fdiv>'\n    +   miniBars(days, mx, \"var(--d3)\", \" min\")\n    +   xLabels(labels)\n    +   (subRows ? '<div class=\"eyebrow\" style=\"margin-top:16px\">Where it went<\u002Fdiv>'+subRows : '')\n    + '<\u002Fdiv>';\n\n  each(\"[data-funlog]\",box,function(b){\n    on(b,\"click\",function(){ fUnlog(+b.dataset.funlog); });\n  });\n  on($(\"#fGoalEdit\"),\"click\",function(){\n    openModal('<h2>Daily focus goal<\u002Fh2>'\n      + '<div class=\"md\">How many minutes of real deep work counts as a day done? Two blocks is a solid target on a school day.<\u002Fdiv>'\n      + '<div class=\"pills\" id=\"goalPick\">'\n      + [30,50,60,90,120,180].map(function(v){\n          return '<button data-goal=\"'+v+'\" aria-pressed=\"'+(F.goal===v)+'\">'+fHrs(v)+'<\u002Fbutton>'; }).join(\"\")\n      + '<\u002Fdiv><div class=\"row\" style=\"margin-top:14px\"><button class=\"ghost\" data-close>Close<\u002Fbutton><\u002Fdiv>',\n      function(root){\n        each(\"[data-goal]\",root,function(b){\n          on(b,\"click\",function(){ F.goal=+b.dataset.goal; touch(); closeModal(); fPaint(true); });\n        });\n      });\n  });\n}\n\n/* ══════════ GYM SCREEN ══════════ */\nfunction renderGym(){\n  var sec=$(\"#s-gym\"); if(!sec) return;\n  var G=gCfg();\n  var tabs='<div class=\"pills\" id=\"gymTabs\" style=\"margin-bottom:12px\">'\n    + [[\"today\",\"Workout\"],[\"hist\",\"History\"],[\"lifts\",\"Lifts\"],[\"prog\",\"Program\"]].map(function(t){\n        return '<button data-gv=\"'+t[0]+'\" aria-pressed=\"'+(GYM_VIEW===t[0])+'\">'+t[1]+'<\u002Fbutton>'; }).join(\"\")\n    + '<\u002Fdiv>';\n  if(G.draft && gDraftStale()){ G.draft=null; touch(); }\n  sec.innerHTML = '<div class=\"card\"><div class=\"spread\" style=\"margin-bottom:10px\"><h2>Gym<\u002Fh2>'\n    + '<span class=\"src\">'+gWeekSessions().length+' this week<\u002Fspan><\u002Fdiv>'+tabs+'<\u002Fdiv>'\n    + (GYM_VIEW===\"today\" ? (G.draft ? gDraftHTML() : gPickHTML())\n      : GYM_VIEW===\"hist\" ? gHistHTML()\n      : GYM_VIEW===\"lifts\" ? gLiftsHTML() : gProgHTML());\n  each(\"[data-gv]\",$(\"#gymTabs\"),function(b){\n    on(b,\"click\",function(){ GYM_VIEW=b.dataset.gv; renderGym(); });\n  });\n  if(GYM_VIEW===\"today\"){ G.draft ? gWireDraft() : gWirePick(); }\n  else if(GYM_VIEW===\"hist\") gWireHist();\n  else if(GYM_VIEW===\"lifts\") gWireLifts();\n  else gWireProg();\n}\n\n/* ── pick a day ── */\nfunction gPickHTML(){\n  var G=gCfg(), last=G.log[G.log.length-1];\n  var next=null;\n  if(last){\n    var i=G.prog.map(function(d){return d.id;}).indexOf(last.dayId);\n    if(i>=0) next=G.prog[(i+1)%G.prog.length];\n  }\n  return '<div class=\"card\">'\n    + '<h2>What are you training?<\u002Fh2>'\n    + (next ? '<div class=\"hint\">Last session was '+esc(last.n)+' on '+fmtD(last.d)+'. Next in the rotation is <b>'+esc(next.n)+'<\u002Fb>.<\u002Fdiv>'\n            : '<div class=\"hint\">Pick a day to start logging. Each exercise will show what you lifted last time.<\u002Fdiv>')\n    + '<div class=\"gdays\">'+G.prog.map(function(d){\n        var l=G.log.filter(function(s){ return s.dayId===d.id; }).slice(-1)[0];\n        return '<button class=\"gday'+(next&&next.id===d.id?\" up\":\"\")+'\" data-gstart=\"'+d.id+'\">'\n          + '<b>'+esc(d.n)+'<\u002Fb><small>'+d.ex.length+' exercises'+(l?' · last '+fmtD(l.d):' · never done')+'<\u002Fsmall><\u002Fbutton>';\n      }).join(\"\")+'<\u002Fdiv><\u002Fdiv>';\n}\nfunction gWirePick(){\n  each(\"[data-gstart]\",$(\"#s-gym\"),function(b){ on(b,\"click\",function(){ gStart(b.dataset.gstart); }); });\n}\n\n/* ── logging a session ── */\nfunction gDraftHTML(){\n  var G=gCfg(), d=G.draft, day=gDay(d.dayId);\n  var body=d.ex.map(function(e,ei){\n    var def=(day?day.ex:[]).filter(function(x){ return x.n===e.n; })[0]\n      || {n:e.n, s:e.sets.length, lo:6, hi:8, inc:2.5, w:null, tech:\"\", note:\"\"};\n    var last=gLast(e.n), sg=gSuggest(def);\n    var reps = def.hi ? (def.lo===def.hi ? def.lo : def.lo+'–'+def.hi) : 'failure';\n    return '<div class=\"gex\" data-ei=\"'+ei+'\">'\n      + '<div class=\"gexh\"><b>'+esc(e.n)\n      +   (def.tech ? '<i class=\"gtech\" data-gtech=\"'+esc(def.tech)+'\">'+esc(def.tech===\"FST7\"?\"FST-7\":def.tech)+'<\u002Fi>' : '')\n      +   '<\u002Fb><span>'+def.s+' × '+reps+'<\u002Fspan><\u002Fdiv>'\n      + (def.note ? '<div class=\"gnote\">'+esc(def.note)+'<\u002Fdiv>' : '')\n      + (last ? '<div class=\"glast\">Last ('+esc(fmtD(last.when))+'): '+last.sets.map(gSetStr).join(\", \")+'<\u002Fdiv>' : '')\n      + (sg.msg ? '<div class=\"gsug'+(sg.kind===\"up\"?\" up\":\"\")+'\">'+esc(sg.msg)+'<\u002Fdiv>' : '')\n      + '<div class=\"gsets\">'+e.sets.map(function(s,si){\n          return '<div class=\"gset\"><span>'+(si+1)+'<\u002Fspan>'\n            + '<input class=\"fld sm\" inputmode=\"decimal\" data-gw=\"'+ei+'-'+si+'\" value=\"'+(s.w==null?\"\":s.w)+'\" placeholder=\"'+esc(gCfg().unit)+'\">'\n            + '<i>×<\u002Fi>'\n            + '<input class=\"fld sm\" inputmode=\"numeric\" data-gr=\"'+ei+'-'+si+'\" value=\"'+(s.r==null?\"\":s.r)+'\" placeholder=\"reps\">'\n            + '<button class=\"gx\" data-gdel=\"'+ei+'-'+si+'\" aria-label=\"Remove set\">×<\u002Fbutton><\u002Fdiv>';\n        }).join(\"\")\n      + '<\u002Fdiv><button class=\"ghost sm gadd\" data-gadd=\"'+ei+'\">Add set<\u002Fbutton><\u002Fdiv>';\n  }).join(\"\");\n  return '<div class=\"card\">'\n    + '<div class=\"spread\" style=\"margin-bottom:6px\"><h2>'+esc(d.n)+'<\u002Fh2>'\n    +   '<span class=\"src\">'+esc(fmtD(d.d))+'<\u002Fspan><\u002Fdiv>'\n    + '<div class=\"hint\">Fill in what you actually did. Leave a set blank if you skipped it.<\u002Fdiv>'\n    + body\n    + '<label class=\"lbl\" style=\"margin-top:14px\">Note<\u002Flabel>'\n    + '<input class=\"fld sm\" id=\"gNote\" placeholder=\"Felt heavy, left elbow twinge, gym was packed…\" value=\"'+esc(d.note||\"\")+'\">'\n    + '<div class=\"row\" style=\"margin-top:16px;gap:8px\">'\n    +   '<button class=\"primary sm\" id=\"gFinish\">Finish and save<\u002Fbutton>'\n    +   '<button class=\"ghost sm\" id=\"gDiscard\">Discard<\u002Fbutton><\u002Fdiv>'\n    + '<\u002Fdiv>';\n}\nfunction gWireDraft(){\n  var G=gCfg(), d=G.draft, root=$(\"#s-gym\");\n  each(\"[data-gw]\",root,function(el){\n    on(el,\"input\",function(){\n      var p=el.dataset.gw.split(\"-\"); d.ex[+p[0]].sets[+p[1]].w=gNum(el.value); touch();\n    });\n  });\n  each(\"[data-gr]\",root,function(el){\n    on(el,\"input\",function(){\n      var p=el.dataset.gr.split(\"-\"); d.ex[+p[0]].sets[+p[1]].r=gNum(el.value); touch();\n    });\n  });\n  each(\"[data-gadd]\",root,function(b){\n    on(b,\"click\",function(){\n      var e=d.ex[+b.dataset.gadd], prev=e.sets[e.sets.length-1];\n      e.sets.push({w:prev?prev.w:0, r:null}); touch(); renderGym();\n    });\n  });\n  each(\"[data-gdel]\",root,function(b){\n    on(b,\"click\",function(){\n      var p=b.dataset.gdel.split(\"-\"), e=d.ex[+p[0]];\n      if(e.sets.length>1) e.sets.splice(+p[1],1); else e.sets[0]={w:e.sets[0].w, r:null};\n      touch(); renderGym();\n    });\n  });\n  each(\"[data-gtech]\",root,function(b){\n    on(b,\"click\",function(){\n      var k=b.dataset.gtech;\n      openModal('<h2>'+esc(k===\"FST7\"?\"FST-7\":k)+'<\u002Fh2><div class=\"md\">'+esc(GYM_TECH[k]||\"\")+'<\u002Fdiv>'\n        +'<div class=\"md\">Apply it to the <b>last set only<\u002Fb> of this exercise. On every set it will bury you.<\u002Fdiv>'\n        +'<div class=\"row\" style=\"margin-top:12px\"><button class=\"ghost\" data-close>Got it<\u002Fbutton><\u002Fdiv>');\n    });\n  });\n  on($(\"#gNote\"),\"input\",function(e){ d.note=e.target.value; touch(); });\n  on($(\"#gFinish\"),\"click\",gFinish);\n  on($(\"#gDiscard\"),\"click\",function(){\n    openModal('<h2>Throw this session away?<\u002Fh2><div class=\"md\">Everything you have typed for '+esc(d.n)+' will go.<\u002Fdiv>'\n      +'<div class=\"row\"><button class=\"primary\" id=\"gdYes\">Discard it<\u002Fbutton><button class=\"ghost\" data-close>Keep logging<\u002Fbutton><\u002Fdiv>',\n      function(root){ on(root.querySelector(\"#gdYes\"),\"click\",function(){ closeModal(); gDiscard(); }); });\n  });\n}\n\n/* ── history ── */\nfunction gHistHTML(){\n  var G=gCfg(), list=G.log.slice().reverse().slice(0,25);\n  if(!list.length) return '<div class=\"card\"><div class=\"hint\" style=\"margin:0\">Nothing logged yet. Your sessions will build up here.<\u002Fdiv><\u002Fdiv>';\n  return '<div class=\"card\"><h2>Recent sessions<\u002Fh2>'\n    + list.map(function(s){\n        var sets=0; (s.ex||[]).forEach(function(e){ sets+=e.sets.length; });\n        return '<div class=\"ghrow\" data-gh=\"'+s.id+'\">'\n          + '<div class=\"ghh\"><b>'+esc(s.n)+'<\u002Fb><span>'+esc(fmtD(s.d))+'<\u002Fspan><\u002Fdiv>'\n          + '<div class=\"ghs\">'+(s.ex||[]).length+' exercises · '+sets+' sets · '+Math.round(gVolume(s))+gCfg().unit+' total'\n          + (s.note?' · '+esc(s.note.slice(0,40)):'')+'<\u002Fdiv><\u002Fdiv>';\n      }).join(\"\")\n    + '<\u002Fdiv>';\n}\nfunction gWireHist(){\n  each(\"[data-gh]\",$(\"#s-gym\"),function(r){\n    on(r,\"click\",function(){\n      var s=gCfg().log.filter(function(x){ return x.id===r.dataset.gh; })[0];\n      if(!s) return;\n      openModal('<h2>'+esc(s.n)+'<\u002Fh2><div class=\"eyebrow\">'+esc(fmtD(s.d))+'<\u002Fdiv>'\n        + (s.ex||[]).map(function(e){\n            return '<div class=\"gmex\"><b>'+esc(e.n)+'<\u002Fb><span>'+e.sets.map(gSetStr).join(\", \")+'<\u002Fspan><\u002Fdiv>'; }).join(\"\")\n        + (s.note?'<div class=\"md\" style=\"margin-top:10px\">'+esc(s.note)+'<\u002Fdiv>':'')\n        + '<div class=\"row\" style=\"margin-top:14px\"><button class=\"ghost\" data-close>Close<\u002Fbutton>'\n        + '<button class=\"ghost\" id=\"gDel\" style=\"margin-left:auto;color:var(--neg)\">Delete<\u002Fbutton><\u002Fdiv>',\n        function(root){\n          on(root.querySelector(\"#gDel\"),\"click\",function(){\n            var G=gCfg(); G.log=G.log.filter(function(x){ return x.id!==s.id; });\n            touch(); closeModal(); renderGym();\n          });\n        });\n    });\n  });\n}\n\n/* ── per-lift progress ── */\nfunction gLiftNames(){\n  var seen={}, out=[];\n  gCfg().log.forEach(function(s){ (s.ex||[]).forEach(function(e){ if(!seen[e.n]){ seen[e.n]=1; out.push(e.n); } }); });\n  return out;\n}\nfunction gLiftsHTML(){\n  var names=gLiftNames();\n  if(!names.length) return '<div class=\"card\"><div class=\"hint\" style=\"margin:0\">Log a session or two and your lifts will show their progress here.<\u002Fdiv><\u002Fdiv>';\n  return '<div class=\"card\"><h2>Lifts<\u002Fh2>'\n    + '<div class=\"hint\">Top set of each session, and your best estimated single.<\u002Fdiv>'\n    + names.map(function(n){\n        var best=gBest(n), last=gLast(n);\n        var tops=[];\n        gCfg().log.forEach(function(s){\n          (s.ex||[]).forEach(function(e){\n            if(e.n!==n) return;\n            var t=0; (e.sets||[]).forEach(function(x){ if(x.w>t) t=x.w; });\n            if(t) tops.push(t);\n          });\n        });\n        tops=tops.slice(-10);\n        var mx=Math.max.apply(null,tops.concat([1]));\n        return '<div class=\"glift\">'\n          + '<div class=\"glh\"><b>'+esc(n)+'<\u002Fb>'+(best?'<span>best '+gFmtW(Math.round(best.v*10)/10)+' est.<\u002Fspan>':'')+'<\u002Fdiv>'\n          + (tops.length>1 ? miniBars(tops, mx*1.15, \"var(--d1)\", gCfg().unit) : '')\n          + '<div class=\"gls\">'+(last?'Last: '+last.sets.map(gSetStr).join(\", \")+' on '+esc(fmtD(last.when)):'')+'<\u002Fdiv>'\n          + '<\u002Fdiv>';\n      }).join(\"\")\n    + '<\u002Fdiv>';\n}\nfunction gWireLifts(){}\n\n/* ── program editor ── */\nfunction gProgHTML(){\n  var G=gCfg();\n  return '<div class=\"card\"><h2>Your program<\u002Fh2>'\n    + '<div class=\"hint\">Sets and rep range per exercise. When you clear the top of the range on every set, Compass tells you to add weight.<\u002Fdiv>'\n    + G.prog.map(function(d,di){\n        return '<div class=\"gpd\">'\n          + '<div class=\"gpdh\"><input class=\"fld sm\" data-gdn=\"'+di+'\" value=\"'+esc(d.n)+'\">'\n          + '<button class=\"gx\" data-gdd=\"'+di+'\" aria-label=\"Remove day\">×<\u002Fbutton><\u002Fdiv>'\n          + d.ex.map(function(e,ei){\n              return '<div class=\"gpe\">'\n                + '<input class=\"fld sm nm\" data-gen=\"'+di+'-'+ei+'\" value=\"'+esc(e.n)+(e.tech?\" [\"+(e.tech===\"FST7\"?\"FST-7\":e.tech)+\"]\":\"\")+'\">'\n                + '<input class=\"fld sm n\" inputmode=\"numeric\" data-ges=\"'+di+'-'+ei+'\" value=\"'+e.s+'\" aria-label=\"Sets\">'\n                + '<i>×<\u002Fi>'\n                + '<input class=\"fld sm n\" inputmode=\"numeric\" data-gel=\"'+di+'-'+ei+'\" value=\"'+e.lo+'\" aria-label=\"Low reps\">'\n                + '<i>–<\u002Fi>'\n                + '<input class=\"fld sm n\" inputmode=\"numeric\" data-geh=\"'+di+'-'+ei+'\" value=\"'+e.hi+'\" aria-label=\"High reps\">'\n                + '<button class=\"gx\" data-gex=\"'+di+'-'+ei+'\" aria-label=\"Remove exercise\">×<\u002Fbutton><\u002Fdiv>';\n            }).join(\"\")\n          + '<button class=\"ghost sm gadd\" data-gaddex=\"'+di+'\">Add exercise<\u002Fbutton><\u002Fdiv>';\n      }).join(\"\")\n    + '<div class=\"row\" style=\"margin-top:14px;gap:8px\">'\n    +   '<button class=\"ghost sm\" id=\"gAddDay\">Add a day<\u002Fbutton>'\n    +   '<button class=\"ghost sm\" id=\"gReset\">Start from the default<\u002Fbutton><\u002Fdiv>'\n    + '<\u002Fdiv>';\n}\nfunction gWireProg(){\n  var G=gCfg(), root=$(\"#s-gym\");\n  function bind(sel,fn){ each(sel,root,function(el){ on(el,\"input\",function(){ fn(el); touch(); }); }); }\n  bind(\"[data-gdn]\",function(el){ G.prog[+el.dataset.gdn].n=el.value; });\n  bind(\"[data-gen]\",function(el){ var p=el.dataset.gen.split(\"-\");\n    G.prog[+p[0]].ex[+p[1]].n=el.value.replace(/\\s*\\[(FST-7|R-P|DROP)\\]\\s*$/,\"\"); });\n  bind(\"[data-ges]\",function(el){ var p=el.dataset.ges.split(\"-\"); G.prog[+p[0]].ex[+p[1]].s=Math.max(1,Math.min(10,+el.value||1)); });\n  bind(\"[data-gel]\",function(el){ var p=el.dataset.gel.split(\"-\"); G.prog[+p[0]].ex[+p[1]].lo=Math.max(1,Math.min(30,+el.value||1)); });\n  bind(\"[data-geh]\",function(el){ var p=el.dataset.geh.split(\"-\"); G.prog[+p[0]].ex[+p[1]].hi=Math.max(1,Math.min(30,+el.value||1)); });\n  each(\"[data-gex]\",root,function(b){ on(b,\"click\",function(){\n    var p=b.dataset.gex.split(\"-\"); G.prog[+p[0]].ex.splice(+p[1],1); touch(); renderGym(); }); });\n  each(\"[data-gdd]\",root,function(b){ on(b,\"click\",function(){\n    if(G.prog.length>1){ G.prog.splice(+b.dataset.gdd,1); touch(); renderGym(); } }); });\n  each(\"[data-gaddex]\",root,function(b){ on(b,\"click\",function(){\n    G.prog[+b.dataset.gaddex].ex.push({id:nid(), n:\"New exercise\", s:3, lo:8, hi:12, inc:2.5});\n    touch(); renderGym(); }); });\n  on($(\"#gAddDay\"),\"click\",function(){ G.prog.push({id:nid(), n:\"New day\", ex:[]}); touch(); renderGym(); });\n  on($(\"#gReset\"),\"click\",function(){\n    openModal('<h2>Back to the default program?<\u002Fh2><div class=\"md\">Your logged sessions stay. Only the plan is replaced.<\u002Fdiv>'\n      +'<div class=\"row\"><button class=\"primary\" id=\"grYes\">Replace the plan<\u002Fbutton><button class=\"ghost\" data-close>Cancel<\u002Fbutton><\u002Fdiv>',\n      function(root){ on(root.querySelector(\"#grYes\"),\"click\",function(){\n        G.prog=gDefaultProgram(); touch(); closeModal(); renderGym(); }); });\n  });\n}\n\n/* ══════════ CALENDAR ══════════\n   Nothing new is stored here. Every day already carries sleep, energy, mood,\n   To-do items, habits, focus minutes and gym sessions — this is the place that\n   puts one day's worth of that back together so you can look at it later. */\nvar CAL_M = null;   // first of the month being viewed\n\nfunction calMonth(){\n  if(!CAL_M){ CAL_M=new Date(NOW.getFullYear(), NOW.getMonth(), 1); }\n  return CAL_M;\n}\nfunction calShift(n){\n  var m=calMonth();\n  CAL_M=new Date(m.getFullYear(), m.getMonth()+n, 1);\n  renderCal();\n}\n/* Everything recorded for one date, gathered in one place. */\nfunction calDay(k){\n  var d=S.days[k]||null;\n  var gym=(S.gym&&S.gym.log||[]).filter(function(x){ return x.d===k; });\n  var blocks=(S.focus&&S.focus.log||[]).filter(function(x){ return x.d===k; });\n  var big=d?(d.big3||[]).filter(function(b){ return b.t&&b.t.trim(); }):[];\n  var habits=d?S.habits.filter(function(h){ return d.habits&&d.habits[h.id]===\"done\"; }):[];\n  return {\n    k:k, d:d, gym:gym, blocks:blocks, big:big, habits:habits,\n    focus:d?(d.focus||0):0,\n    done:big.filter(function(b){ return b.d; }).length,\n    any: !!(d && ((d.focus||0)>0 || big.length || d.sleep>0 || d.mood || (d.win&&d.win.trim())\n      || (d.anchors&&d.anchors.length) || habits.length)) || gym.length>0\n  };\n}\nfunction calRender(){ renderCal(); }\n\nfunction renderCal(){\n  var sec=$(\"#s-cal\"); if(!sec) return;\n  var m=calMonth(), y=m.getFullYear(), mo=m.getMonth();\n  var first=new Date(y,mo,1), lead=(first.getDay()+6)%7;          // Monday-first\n  var dim=new Date(y,mo+1,0).getDate();\n  var today=iso(new Date());\n\n  // the busiest focus day this month sets the shading scale\n  var peak=0;\n  for(var i=1;i<=dim;i++){ var v=calDay(iso(new Date(y,mo,i))).focus; if(v>peak) peak=v; }\n  var goal=(S.focus&&S.focus.goal)||60;\n  var scale=Math.max(peak, goal);\n\n  var cells=\"\";\n  for(var b=0;b<lead;b++) cells+='<div class=\"cc empty\"><\u002Fdiv>';\n  var mTot=0, mGym=0, mDays=0;\n  for(var n=1;n<=dim;n++){\n    var k=iso(new Date(y,mo,n)), info=calDay(k);\n    mTot+=info.focus; mGym+=info.gym.length; if(info.any) mDays++;\n    var lvl = !info.focus ? 0 : Math.min(4, Math.ceil(info.focus/scale*4));\n    var cls=\"cc l\"+lvl;\n    if(k===today) cls+=\" today\";\n    if(k>today) cls+=\" future\";\n    if(!info.any && k<=today) cls+=\" blank\";\n    cells+='<button class=\"'+cls+'\" data-cal=\"'+k+'\">'\n      + '<span class=\"n\">'+n+'<\u002Fspan>'\n      + '<span class=\"dots\">'\n      +   (info.gym.length?'<i class=\"g\"><\u002Fi>':'')\n      +   (info.done?'<i class=\"b\"><\u002Fi>':'')\n      + '<\u002Fspan><\u002Fbutton>';\n  }\n\n  sec.innerHTML = '<div class=\"card\">'\n    + '<div class=\"calhead\">'\n    +   '<button class=\"ghost sm\" id=\"calPrev\" aria-label=\"Previous month\">‹<\u002Fbutton>'\n    +   '<h2>'+MON[mo]+' '+y+'<\u002Fh2>'\n    +   '<button class=\"ghost sm\" id=\"calNext\" aria-label=\"Next month\">›<\u002Fbutton>'\n    + '<\u002Fdiv>'\n    + '<div class=\"calw\">'+[\"M\",\"T\",\"W\",\"T\",\"F\",\"S\",\"S\"].map(function(x){ return '<span>'+x+'<\u002Fspan>'; }).join(\"\")+'<\u002Fdiv>'\n    + '<div class=\"calg\">'+cells+'<\u002Fdiv>'\n    + '<div class=\"callegend\">'\n    +   '<span class=\"lk\"><i class=\"sw l1\"><\u002Fi><i class=\"sw l2\"><\u002Fi><i class=\"sw l3\"><\u002Fi><i class=\"sw l4\"><\u002Fi> focus time<\u002Fspan>'\n    +   '<span class=\"lk\"><i class=\"dot g\"><\u002Fi> gym<\u002Fspan>'\n    +   '<span class=\"lk\"><i class=\"dot b\"><\u002Fi> To-do done<\u002Fspan>'\n    + '<\u002Fdiv>'\n    + '<div class=\"calsum\">'+fHrs(mTot)+' focused · '+mGym+' gym session'+(mGym===1?'':'s')\n    +   ' · '+mDays+' day'+(mDays===1?'':'s')+' with something logged<\u002Fdiv>'\n    + '<\u002Fdiv>'\n    + '<div id=\"calDetail\"><\u002Fdiv>';\n\n  on($(\"#calPrev\"),\"click\",function(){ calShift(-1); });\n  on($(\"#calNext\"),\"click\",function(){ calShift(1); });\n  each(\"[data-cal]\",sec,function(b){ on(b,\"click\",function(){ calShow(b.dataset.cal); }); });\n  calShow(iso(new Date()) <= iso(new Date(y,mo,dim)) && iso(new Date(y,mo,1)) <= iso(new Date()) ? today : iso(new Date(y,mo,1)));\n}\n\nvar MOODW={};\nfunction calShow(k){\n  var box=$(\"#calDetail\"); if(!box) return;\n  var info=calDay(k), d=info.d;\n  var parts=[];\n\n  if(!info.any){\n    box.innerHTML='<div class=\"card\"><div class=\"spread\" style=\"margin-bottom:8px\"><h2>'+esc(fmtD(k))+'<\u002Fh2>'\n      +'<span class=\"src\">'+esc(DAYN[pISO(k).getDay()])+'<\u002Fspan><\u002Fdiv>'\n      +'<div class=\"hint\" style=\"margin:0\">Nothing recorded'+(k>iso(new Date())?\" yet — this day hasn't happened.\":\" on this day.\")+'<\u002Fdiv><\u002Fdiv>';\n    return;\n  }\n  if(info.big.length){\n    parts.push('<div class=\"eyebrow\">To-do<\u002Fdiv><div class=\"calbig\">'\n      + info.big.map(function(x){\n          return '<div class=\"cb'+(x.d?\" done\":\"\")+'\"><span class=\"tick\">'+(x.d?\"✓\":\"·\")+'<\u002Fspan><span>'+esc(x.t)\n            + (x.mins?' <i>'+x.mins+' min<\u002Fi>':'')+'<\u002Fspan><\u002Fdiv>'; }).join(\"\")\n      + '<\u002Fdiv>');\n  }\n  var facts=[];\n  if(info.focus) facts.push([\"Focused\", fHrs(info.focus)]);\n  if(d && d.sleep>0) facts.push([\"Slept\", d.sleep+\" h\"]);\n  if(d && d.energy) facts.push([\"Energy\", d.energy+\"/5\"]);\n  if(d && d.mood && parts.join(\"\")+'<\u002Fdiv>';\n}\n\n/* ══════════ WEEK ══════════ */\nfunction renderWeek(){\n  var e=execScore();\n  var eb=$(\"#execBar\");\n  eb.querySelector(\"i\").style.width=e+\"%\";\n  eb.querySelector(\"b\").textContent=e+\"%\";\n  eb.querySelector(\"i\").style.background = e>=85?\"var(--d3)\":e>=60?\"var(--d1)\":\"var(--d4)\";\n  $(\"#wkLabel\").textContent=\"Week of \"+wkStart(NOW).getDate()+\" \"+MON[wkStart(NOW).getMonth()].slice(0,3);\n\n  var ws=wkStart(NOW), fm=0, done3=0, name3=0, mins=0;\n  for(var i=0;i<7;i++){ var k=iso(addD(ws,i)); if(k>TODAY) break; var d=S.days[k]; if(!d) continue;\n    fm+=d.focus||0; (d.big3||[]).forEach(function(b){ if(b.t&&b.t.trim()){name3++; if(b.d) done3++;} }); }\n  S.subjects.forEach(function(s){ mins+=s.mins||0; });\n  var avgS=0,cS=0; for(i=0;i<7;i++){ var kk=iso(addD(ws,i)); var dd=S.days[kk]; if(dd&&dd.sleep>0){avgS+=dd.sleep;cS++;} }\n  $(\"#weekTiles\").innerHTML=[\n    tile(\"Deep focus\", Math.round(fm/60*10)/10+\"h\", fm?\"logged in blocks\":\"nothing logged\"),\n    tile(\"To-do\", done3+\"/\"+name3, \"completed this week\"),\n    tile(\"Avg sleep\", cS?(Math.round(avgS/cS*10)/10)+\"h\":\"—\", cS?(avgS/cS>=8?\"in range\":\"below 8h\"):\"not logged\"),\n    tile(\"Study time\", Math.round(mins/60*10)/10+\"h\", \"across subjects\")\n  ].join(\"\");\n\n  var labels=[\"M\",\"T\",\"W\",\"T\",\"F\",\"S\",\"S\"];\n  var head='<tr><th class=\"nmcol\">Habit<\u002Fth>';\n  for(i=0;i<7;i++){ var dd2=addD(ws,i); head+='<th>'+labels[i]+'<div style=\"font-weight:400;opacity:.6;margin-top:2px\">'+dd2.getDate()+'<\u002Fdiv><\u002Fth>'; }\n  head+='<th style=\"text-align:left;padding-left:12px\">Week<\u002Fth><th style=\"text-align:left\">Strength<\u002Fth><\u002Ftr>';\n  var rows=S.habits.map(function(h){\n    var r='<tr><td class=\"nm\">'+esc(h.n)+'<small>'+(h.anchor?\"After \"+esc(h.anchor):\"no anchor set\")+'<\u002Fsmall><\u002Ftd>';\n    var w=habitWeek(h,ws);\n    for(var i=0;i<7;i++){\n      var d=addD(ws,i), k=iso ion(x){ return x.id!==e.dataset.tkx; }); touch(); renderTodo();});});\n}\n\n/* The quick-add box. On the Today filter it commits straight to the day; on any\n   backlog filter it captures into that bucket instead. */\nfunction tdQuickAdd(){\n  var f=$(\"#todoNew\"); if(!f) return;\n  var p=tdParse(f.value); if(!p.text) return;\n  var pri=p.pri || ($(\"#todoNewPri\")?$(\"#todoNewPri\").value:\"md\");\n  var mins=p.mins || (+($(\"#todoNewMins\")?$(\"#todoNewMins\").value:60) || 60);\n  var view=tdView();\n  if(view===\"today\"||view===\"done\"){\n    tdPush({t:p.text, mins:mins, pri:pri});\n    S.todoView=\"today\";\n  } else {\n    S.tasks.push({id:nid(), text:p.text.slice(0,200), bucket:view, done:false, created:TODAY,\n      moves:0, plan:\"\", mins:mins, para:\"\", pri:pri, due:\"\"});\n  }\n  f.value=\"\"; touch(); renderTodo(); afterTodo(); f.focus();\n}\n/* Kept under its old name so every existing caller — the wizards, the assistant,\n   renderAll — still reaches the list. */\nfunction renderTasks(){ renderTodo(); }\nfunction addTask(text,bucket){\n  var v=String(text||\"\").trim(); if(!v) return null;\n  var t={id:nid(),text:v,bucket:bucket||\"inbox\",done:false,created:TODAY,moves:0,plan:\"\",mins:0,para:\"\",pri:\"md\",due:\"\"};\n  S.tasks.push(t); touch(); return t;\n}\nfunction clarify(t){\n  if(!t) return;\n  var st={step:0};\n  openModal(\"\",function(){});\n  function draw(){\n    var b=$(\"#modalBody\");\n    if(st.step===0){\n      b.innerHTML='<h2>Is this actually actionable?<\u002Fh2>'\n        +'<div class=\"md\">“'+esc(t.text)+'”<\u002Fdiv>'\n        +'<div class=\"pills\"><button data-c=\"yes\">Yes — there’s something to do<\u002Fbutton>'\n        +'<button data-c=\"ref\">No — it’s just information<\u002Fbutton>'\n        +'<button data-c=\"some\">Maybe one day<\u002Fbutton>'\n        +'<button data-c=\"bin\">No — bin it<\u002Fbutton><\u002Fdiv>';\n      each(\"[data-c]\",b,function(e){on(e,\"click\",function(){\n        var c=e.dataset.c;\n ic plan has a measurable one.<\u002Fdiv>'\n        +'<input class=\"fld\" id=\"cxPlan\" placeholder=\"If it’s Tuesday after dinner and I’m at my desk, then I’ll…\" value=\"'+esc(t.plan||\"\")+'\">'\n        +'<div class=\"row\" style=\"margin-top:14px;gap:14px;align-items:flex-end\">'\n        +  '<div style=\"flex:1;min-width:130px\"><label class=\"lbl\">Priority<\u002Flabel>'\n        +    '<select class=\"fld sm\" id=\"cxPri\">'\n        +      [[\"hi\",\"High\"],[\"md\",\"Medium\"],[\"lo\",\"Low\"]].map(function(p){\n                 return '<option value=\"'+p[0]+'\"'+((t.pri||\"md\")===p[0]?\" selected\":\"\")+'>'+p[1]+'<\u002Foption>'; }).join(\"\")\n        +    '<\u002Fselect><\u002Fdiv>'\n        +  '<div style=\"flex:1;min-width:130px\"><label class=\"lbl\">Do it by <span class=\"q\">— optional<\u002Fspan><\u002Flabel>'\n        +    '<input class=\"fld sm\" type=\"date\" id=\"cxDue\" value=\"'+esc(t.due||\"\")+'\"><\u002Fdiv>'\n        +'<\u002Fdiv>'\n        +'<label class=\"lbl\" style=\"margin-top:14px\">Where does it live?<\u002Flabel>'\n        +'<div class=\"pills\" id=\"cxB\">'\n        +  '<button data-b=\"today\">Today’s list<\u002Fbutton>'\n        +  TD_BACKLOG.map(function(x){return '<button data-b=\"'+x[0]+'\">'+x[1]+'<\u002Fbutton>';}).join(\"\")+'<\u002Fdiv>'\n        +'<label class=\"lbl\" style=\"margin-top:6px\">Type <span class=\"q\">— optional<\u002Fspan><\u002Flabel>'\n        +'<div class=\"pills\" id=\"cxP\">'+[\"Project\",\"Area\",\"Resource\"].map(function(p){return '<button data-p=\"'+p+'\">'+p+'<\u002Fbutton>';}).join(\"\")+'<\u002Fdiv>';\n      each(\"[data-p]\",b,function(e){on(e,\"click\",function(){\n        t.para=e.dataset.p; each(\"[data-p]\",b,function(x){x.setAttribute(\"aria-pressed\",String(x===e));});touch();});});\n      each(\"[data-b]\",b,function(e){on(e,\"click\",function(){\n        t.plan=$(\"#cxPlan\").value;\n        var pv=$(\"#cxPri\"); if(pv) t.pri=pv.value;\n        var dv=$(\"#cxDue\"); if(dv) t.due=dv.value||\"\";\n        if(e.dataset.b===\"today\"){\n          tdPush({t:t.text, plan:t.plan, mins:t.mins||60, pri:t.pri||\"md\"});\n          S.tasks=S.tasks.filter(function(x){ return x.id!==t.id; });\n          S.todoView=\"today\";\n        } else t.bucket=e.dataset.b;\n        touch(); closeModal(); renderTodo(); afterTodo();});});\n    }\n  }\n  draw();\n}\n\n/* ══════════ GOALS ══════════ */\nvar GPRI={hi:\"High\", md:\"Medium\", lo:\"Low\"};\nvar GSTATUS={active:\"Active\", hold:\"On hold\", done:\"Achieved\", dropped:\"Dropped\"};\nvar GHORIZON=84;                       /* 12 weeks — the default horizon */\n\n/* Older saved goals predate the date and milestone fields. Normalise once here so\n   nothing downstream has to keep asking whether a field exists. */\nfunction gNorm(g){\n  if(!GSTATUS[g.status]) g.status=\"active\";\n  if(!GPRI[g.pri]) g.pri=\"md\";\n  if(typeof g.cat!==\"string\") g.cat=\"\";\n  if(typeof g.notes!==\"string\") g.notes=\"\";\n  if(typeof g.unit!==\"string\") g.unit=\"\";\n  if(!g.start) g.start=TODAY;\n  if(!g.due) g.due=iso(addD(pISO(g.start),GHORIZON));\n  if(g.due<g.start) g.due=iso(addD(pISO(g.start),GHORIZON));\n  if(!Array.isArray(g.ms)) g.ms=[];\n  if(typeof g.lagC!==\"number\") g.lagC=0;\n  if(typeof g.lagT!==\"number\"||g.lagT<=0) g.lagT=100;\n  if(typeof g.leadT!==\"number\"||g.leadT<=0) g.leadT=3;\n  if(!g.leadN) g.leadN=\"Sessions this week\";\n  if(!g.lagN) g.lagN=\"Progress\";\n  return g;\n}\n\n/* Everything the card needs to say something honest about where the goal stands:\n   how much of the window is gone, how much of the outcome is done, and whether\n   the second is keeping up with the first. */\nfunction gStat(g){\n  gNorm(g);\n  var total=Math.max(1, dBetween(g.start,g.due));\n  var gone=clamp(dBetween(g.start,TODAY),0,total);\n  var left=dBetween(TODAY,g.due);\n  var prog=clamp(g.lagC/g.lagT,0,1);\n  var elapsed=clamp(gone/total,0,1);\n  var open=(g.status===\"active\"||g.status===\"hold\");\n  var band=\"on\", label=\"On track\";\n  if(g.status===\"done\"||prog>=1){ band=\"on\"; label=\"Complete\"; }\n  else if(!open){ band=\"off\"; label=GSTATUS[g.status]; }\n  else if(left<0){ band=\"off\"; label=\"Past deadline\"; }\n  else if(prog>=elapsed-0.05){ band=\"on\"; label=\"On track\"; }\n  else if(prog>=elapsed-0.18){ band=\"slip\"; label=\"Slipping\"; }\n  else { band=\"off\"; label=\"Behind\"; }\n  var wksLeft=Math.max(0,left)/7;\n  var need=(prog>=1)?0:(g.lagT-g.lagC)/Math.max(1,wksLeft);\n  return {total:total, gone:gone, left:left, prog:prog, elapsed:elapsed, pct:Math.round(prog*100),\n          open:open, band:band, label:label, need:need, wksLeft:wksLeft};\n}\nfunction gRound(n){ return n>=10?Math.round(n):Math.round(n*10)/10; }\n\nfunction gDays(st, live){\n  var n=st.left, bg=\"var(--surface-2)\", fg=\"var(--ink-2)\", lab=\"days left\";\n  if(live){\n    if(n<0){bg=\"var(--crit)\";fg=\"#fff\";lab=\"overdue\";}\n    else if(n===0){bg=\"var(--crit)\";fg=\"#fff\";lab=\"due today\";}\n    else if(n<=7){bg=\"var(--crit)\";fg=\"#fff\";}\n    else if(n<=21){bg=\"var(--serious)\";fg=\"#0b0b0b\";}\n    else if(n<=42){bg=\"var(--warn)\";fg=\"#0b0b0b\";}\n  }\n  var big=(n<0)?Math.abs(n):(n===0?\"!\":n);\n  return '<div class=\"dl-days\" style=\"background:'+bg+';color:'+fg+'\">'+big+'<span>'+lab+'<\u002Fspan><\u002Fdiv>';\n}\n\nfunction gStatsHtml(){\n  var act=S.goals.filter(function(g){ return gNorm(g).status===\"active\"; });\n  var onT=0, sum=0, next=null;\n  act.forEach(function(g){\n    var st=gStat(g); sum+=st.prog; if(st.band===\"on\") onT++;\n    if(!next||g.due<next.due) next=g;\n  });\n  var avg=act.length?Math.round(sum/act.length*100):0;\n  return '<div class=\"tile\"><div class=\"lb\">Active goals<\u002Fdiv><div class=\"vl\">'+act.length+'<\u002Fdiv>'\n    +   '<div class=\"dl\">'+(act.length>3?\"More than three is how none of them happen\":\"Three is the ceiling\")+'<\u002Fdiv><\u002Fdiv>'\n    + '<div class=\"tile\"><div class=\"lb\">On track<\u002Fdiv><div class=\"vl\">'+onT+'<\u002Fdiv>'\n    +   '<div class=\"dl\">'+(act.length-onT)+' need attention<\u002Fdiv><\u002Fdiv>'\n    + '<div class=\"tile\"><div class=\"lb\">Avg. progress<\u002Fdiv><div class=\"vl\">'+avg+'%<\u002Fdiv>'\n    +   '<div class=\"dl\">Across active goals<\u002Fdiv><\u002Fdiv>'\n    + '<div class=\"tile\"><div class=\"lb\">Next deadline<\u002Fdiv>'\n    +   '<div class=\"vl\">'+(next?(dBetween(TODAY,next.due)<0?\"—\":dBetween(TODAY,next.due)+\"d\"):\"—\")+'<\u002Fdiv>'\n    +   '<div class=\"dl\">'+(next?esc(next.title.slice(0,44)):\"Nothing scheduled\")+'<\u002Fdiv><\u002Fdiv>';\n}\n\nfunction renderGoals(){\n  if(!GSTATUS[S.goalFilter] && S.goalFilter!==\"all\") S.goalFilter=\"active\";\n  if([\"due\",\"pri\",\"prog\"].indexOf(S.goalSort)<0) S.goalSort=\"due\";\n  S.goals.forEach(gNorm);\n\n  $(\"#goalStats\").innerHTML=gStatsHtml();\n  $(\"#goalSort\").textContent=\"Sort: \"+({due:\"deadline\",pri:\"priority\",prog:\"progress\"}[S.goalSort]);\n\n  var counts={all:S.goals.length};\n  [\"active\",\"hold\",\"done\",\"dropped\"].forEach(function(k){\n    counts[k]=S.goals.filter(function(g){return g.status===k;}).length; });\n  $(\"#goalFilter\").innerHTML=[[\"active\",\"Active\"],[\"hold\",\"On hold\"],[\"done\",\"Achieved\"],[\"dropped\",\"Dropped\"],[\"all\",\"All\"]]\n    .map(function(p){ return '<button data-gf=\"'+p[0]+'\" aria-pressed=\"'+(S.goalFilter===p[0])+'\">'+p[1]+' · '+counts[p[0]]+'<\u002Fbutton>'; }).join(\"\");\n  each(\"[data-gf]\",$(\"#goalFilter\"),function(e){on(e,\"click\",function(){\n    S.goalFilter=e.dataset.gf; touch(); renderGoals(); });});\n\n  var PRI={hi:0,md:1,lo:2}, ORD={active:0,hold:1,done:2,dropped:3};\n  var list=S.goals.map(function(g,i){ return {g:g,i:i}; })\n    .filter(function(r){ return S.goalFilter===\"all\"||r.g.status===S.goalFilter; });\n  list.sort(function(a,b){\n    if(ORD[a.g.status]!==ORD[b.g.status]) return ORD[a.g.status]-ORD[b.g.status];\n    if(S.goalSort===\"pri\" && PRI[a.g.pri]!==PRI[b.g.pri]) return PRI[a.g.pri]-PRI[b.g.pri];\n    if(S.goalSort===\"prog\") return gStat(b.g).prog-gStat(a.g).prog;\n    return a.g.due<b.g.due?-1:(a.g.due>b.g.due?1:0);\n  });\n\n  var ws=iso(wkStart(NOW));\n  $(\"#goalCards\").innerHTML = list.length ? list.map(function(r){\n    var g=r.g, i=r.i, st=gStat(g);\n    var lead=(S.lead[g.id]&&S.lead[g.id][ws])||0;\n    var mDone=g.ms.filter(function(m){return m.done;}).length;\n    var msSorted=g.ms.slice().sort(function(a,b){\n      if(a.done!==b.done) return a.done?1:-1;\n      return (a.date||\"9999\")<(b.date||\"9999\")?-1:1; });\n\n    return '<div class=\"card goal-card'+(st.open?\"\":\" is-off\")+'\">'\n      + '<div class=\"goal-top\">'\n      +   gDays(st, st.open && g.status===\"active\")\n      +   '<div style=\"flex:1;min-width:0\">'\n      +     '<input class=\"bare\" data-gt=\"'+i+'\" value=\"'+esc(g.title)+'\" style=\"font-size:16px;font-weight:600;width:100%\">'\n      +     '<div class=\"gmeta\">'\n      +       '<span class=\"chip st-'+g.status+'\">'+GSTATUS[g.status]+'<\u002Fspan>'\n      +       '<span class=\"chip '+g.pri+'\">'+GPRI[g.pri]+' priority<\u002Fspan>'\n      +       (g.cat?'<span class=\"chip tag\">'+esc(g.cat)+'<\u002Fspan>':\"\")\n      +       '<span class=\"chip\">'+fmtD(g.start)+' → '+fmtD(g.due)+'<\u002Fspan>'\n      +       '<span class=\"pace '+st.band+'\">'+st.label+'<\u002Fspan>'\n      +     '<\u002Fdiv>'\n      +   '<\u002Fdiv>'\n      +   '<div class=\"row\" style=\"gap:5px;flex:none\">'\n      +     '<button class=\"ghost sm\" data-ge=\"'+i+'\">Details<\u002Fbutton>'\n      +     '<button class=\"ghost sm\" data-gw=\"'+i+'\">WOOP it<\u002Fbutton>'\n      +     '<button class=\"del\" data-gx=\"'+i+'\" style=\"opacity:1\">&times;<\u002Fbutton>'\n      +   '<\u002Fdiv>'\n      + '<\u002Fdiv>'\n      + (g.why?'<div style=\"font-size:12.5px;color:var(--ink-2);margin:11px 0 0;font-style:italic\">\\u201C'+esc(g.why)+'\\u201D<\u002Fdiv>':\"\")\n      + '<div class=\"gtrack\">'\n      +   '<div class=\"lbl\"><span>Time used · day '+st.gone+' of '+st.total+'<\u002Fspan><span>'+Math.round(st.elapsed*100)+'%<\u002Fspan><\u002Fdiv>'\n      +   '<div class=\"meter thin\"><i class=\"el\" style=\"width:'+Math.round(st.elapsed*100)+'%\"><\u002Fi><\u002Fdiv>'\n      +   '<div class=\"lbl\" style=\"margin-top:9px\"><span>Outcome · '+esc(g.lagN)+'<\u002Fspan>'\n      +     '<span>'+g.lagC+' / '+g.lagT+(g.unit?\" \"+esc(g.unit):\"\")+' · '+st.pct+'%<\u002Fspan><\u002Fdiv>'\n      +   '<div class=\"meter\"><i style=\"width:'+st.pct+'%\"><\u002Fi><\u002Fdiv>'\n      + '<\u002Fdiv>'\n      + (st.open&&st.prog<1&&st.left>=0\n          ? '<div style=\"font-size:11.5px;color:var(--muted);margin-top:2px\">To finish on time: <b style=\"color:var(--ink-2)\">'\n            + gRound(st.need)+' '+(g.unit||\"per\")+' per week<\u002Fb> for the remaining '+gRound(st.wksLeft)+' weeks<\u002Fdiv>' : \"\")\n      + '<div class=\"g2\" style=\"gap:16px;margin-top:16px\">'\n      + '<div><div class=\"eyebrow\">Lead — what you control<\u002Fdiv>'\n      + '<div class=\"spread\"><span style=\"font-size:13.5px\">'+esc(g.leadN)+'<\u002Fspan>'\n      + '<span class=\"mono\" style=\"font-size:13px;color:'+(lead>=g.leadT?\"var(--ok-text)\":\"var(--ink-2)\")+'\">'+lead+' / '+g.leadT+' this week<\u002Fspan><\u002Fdiv>'\n      + '<div class=\"meter\"><i style=\"width:'+Math.min(100,lead/Math.max(1,g.leadT)*100)+'%;background:var(--d3)\"><\u002Fi><\u002Fdiv>'\n      + '<div class=\"row\" style=\"gap:5px\"><button class=\"ghost sm\" data-lm=\"'+i+'\">−<\u002Fbutton><button class=\"ghost sm\" data-lp=\"'+i+'\">+1 done<\u002Fbutton><\u002Fdiv><\u002Fdiv>'\n      + '<div><div class=\"eyebrow\">Lag — the outcome<\u002Fdiv>'\n      + '<div class=\"spread\"><span style=\"font-size:13.5px\">'+esc(g.lagN)+'<\u002Fspan>'\n      + '<span class=\"mono\" style=\"font-size:13px;color:var(--ink-2)\">'+g.lagC+' / '+g.lagT+'<\u002Fspan><\u002Fdiv>'\n      + '<div class=\"meter\"><i style=\"width:'+st.pct+'%\"><\u002Fi><\u002Fdiv>'\n      + '<div class=\"row\" style=\"gap:5px\"><button class=\"ghost sm\" data-am=\"'+i+'\">−<\u002Fbutton><button class=\"ghost sm\" data-ap=\"'+i+'\">+1<\u002Fbutton>'\n      + '<button class=\"ghost sm\" data-as=\"'+i+'\">Set…<\u002Fbutton><\u002Fdiv><\u002Fdiv>'\n      + '<\u002Fdiv>'\n      + '<div class=\"gms\"><div class=\"eyebrow\">Milestones · '+mDone+' of '+g.ms.length+'<\u002Fdiv>'\n      + (msSorted.length ? msSorted.map(function(m){\n          var od=(!m.done&&m.date&&dBetween(TODAY,m.date)<0);\n          return '<div class=\"line'+(m.done?\" done\":\"\")+'\">'\n            + '<button class=\"box\" data-gmk=\"'+i+'\" data-gmid=\"'+m.id+'\" aria-pressed=\"'+!!m.done+'\" aria-label=\"Done\">'+CHECK+'<\u002Fbutton>'\n            + '<span class=\"t\">'+esc(m.t)+'<\u002Fspan>'\n            + '<span class=\"d\"'+(od?' style=\"color:var(--crit)\"':'')+'>'+(m.date?fmtD(m.date):\"no date\")+'<\u002Fspan>'\n            + '<button class=\"del\" data-gmx=\"'+i+'\" data-gmid=\"'+m.id+'\">&times;<\u002Fbutton><\u002Fdiv>';\n        }).join(\"\")\n        : '<div style=\"color:var(--muted);font-size:12.5px;padding:6px 0\">No steps yet. A 12-week goal that isn\\'t broken into steps is a wish with a date on it.<\u002Fdiv>')\n      + '<div class=\"row\" style=\"gap:6px;margin-top:9px\">'\n      +   '<input class=\"fld sm\" data-gmt=\"'+i+'\" placeholder=\"Next concrete step\" style=\"flex:1;min-width:150px\">'\n      +   '<input class=\"fld sm\" data-gmd=\"'+i+'\" type=\"date\" style=\"width:auto\">'\n      +   '<button class=\"ghost sm\" data-gma=\"'+i+'\">Add step<\u002Fbutton>'\n      + '<\u002Fdiv><\u002Fdiv>'\n      + (g.ob?'<div class=\"callout warm\" style=\"margin:16px 0 0;font-size:13px\"><b>The obstacle you named:<\u002Fb> '+esc(g.ob)+'<br><b style=\"color:var(--ink)\">Your plan:<\u002Fb> '+esc(g.plan)+'<\u002Fdiv>':\"\")\n      + (g.notes?'<div class=\"gnote\">'+esc(g.notes)+'<\u002Fdiv>':\"\")\n      + '<\u002Fdiv>';\n  }).join(\"\") : '<div class=\"card\" style=\"color:var(--muted);font-size:13px\">Nothing in this view. Two active goals is plenty.<\u002Fdiv>';\n\n  var box=$(\"#goalCards\");\n  each(\"[data-gt]\",box,function(e){on(e,\"input\",function(){S.goals[+e.dataset.gt].title=e.value;touch();});});\n  each(\"[data-gx]\",box,function(e){on(e,\"click\",function(){ goalRemove(+e.dataset.gx); });});\n  each(\"[data-ge]\",box,function(e){on(e,\"click\",function(){ goalEditor(S.goals[+e.dataset.ge]); });});\n  each(\"[data-gw]\",box,function(e){on(e,\"click\",function(){ woop(S.goals[+e.dataset.gw]); });});\n  each(\"[data-ap]\",box,function(e){on(e,\"click\",function(){var g=S.goals[+e.dataset.ap];g.lagC=Math.min(g.lagT,g.lagC+1);touch();renderGoals();});});\n  each(\"[data-am]\",box,function(e){on(e,\"click\",function(){var g=S.goals[+e.dataset.am];g.lagC=Math.max(0,g.lagC-1);touch();renderGoals();});});\n  each(\"[data-as]\",box,function(e){on(e,\"click\",function(){ goalSetValue(S.goals[+e.dataset.as]); });});\n  each(\"[data-lp]\",box,function(e){on(e,\"click\",function(){bumpLead(+e.dataset.lp,1);});});\n  each(\"[data-lm]\",box,function(e){on(e,\"click\",function(){bumpLead(+e.dataset.lm,-1);});});\n  each(\"[data-gma]\",box,function(e){on(e,\"click\",function(){ gmAdd(+e.dataset.gma); });});\n  each(\"[data-gmt]\",box,function(e){on(e,\"keydown\",function(ev){ if(ev.key===\"Enter\"){ ev.preventDefault(); gmAdd(+e.dataset.gmt); } });});\n  each(\"[data-gmk]\",box,function(e){on(e,\"click\",function(){\n    var g=S.goals[+e.dataset.gmk], m=gmFind(g,e.dataset.gmid);\n    if(m){ m.done=!m.done; touch(); renderGoals(); } });});\n  each(\"[data-gmx]\",box,function(e){on(e,\"click\",function(){\n    var g=S.goals[+e.dataset.gmx], id=e.dataset.gmid;\n    g.ms=g.ms.filter(function(m){return m.id!==id;}); touch(); renderGoals(); });});\n}\nfunction gmFind(g,id){ return g.ms.filter(function(m){return m.id===id;})[0]; }\n\n/* Deleting a goal you've put weeks into loses the record of what happened, so\n   retiring it is offered first and deletion has to be chosen deliberately. */\nfunction goalRemove(i){\n  var g=S.goals[i];\n  if(!g) return;\n  if(g.status!==\"active\" && !g.lagC && !g.ms.length){\n    S.goals.splice(i,1); touch(); renderGoals(); return;\n  }\n  openModal('<h2>Remove \\u201C'+esc(g.title)+'\\u201D?<\u002Fh2>'\n    + '<div class=\"hint\">Dropping it keeps the record — what you tried, how far you got, when you stopped. Deleting throws that away.<\u002Fdiv>'\n    + '<div class=\"stepnav\"><button class=\"primary\" id=\"grDrop\">Mark dropped<\u002Fbutton>'\n    + '<button class=\"ghost\" id=\"grDel\" style=\"color:var(--crit)\">Delete permanently<\u002Fbutton>'\n    + '<button class=\"ghost\" data-close style=\"margin-left:auto\">Cancel<\u002Fbutton><\u002Fdiv>',\n  function(){\n    on($(\"#grDrop\"),\"click\",function(){ g.status=\"dropped\"; touch(); closeModal(); renderGoals(); });\n    on($(\"#grDel\"),\"click\",function(){ S.goals.splice(i,1); touch(); closeModal(); renderGoals(); });\n  });\n}\n\nfunction gmAdd(i){\n  var g=S.goals[i], box=$(\"#goalCards\");\n  var t=box.querySelector('[data-gmt=\"'+i+'\"]'), d=box.querySelector('[data-gmd=\"'+i+'\"]');\n  var txt=(t.value||\"\").trim(); if(!txt) return;\n  g.ms.push({id:nid(), t:txt.slice(0,120), date:d.value||\"\", done:false});\n  touch(); renderGoals();\n}\n\n/* Typing a number beats clicking +1 forty times. */\nfunction goalSetValue(g){\n  openModal('<h2>Where are you actually at?<\u002Fh2>'\n    + '<div class=\"hint\">'+esc(g.lagN)+' — out of '+g.lagT+(g.unit?\" \"+esc(g.unit):\"\")+'.<\u002Fdiv>'\n    + '<input class=\"fld\" id=\"gsv\" type=\"number\" min=\"0\" step=\"any\" value=\"'+g.lagC+'\">'\n    + '<div class=\"stepnav\"><button class=\"primary\" id=\"gsvSave\">Save<\u002Fbutton>'\n    + '<button class=\"ghost\" data-close style=\"margin-left:auto\">Cancel<\u002Fbutton><\u002Fdiv>',\n    function(){\n      var f=$(\"#gsv\"); f.focus(); f.select();\n      function save(){ var v=parseFloat(f.value); if(isNaN(v)) v=0;\n        g.lagC=clamp(v,0,g.lagT); touch(); closeModal(); renderGoals(); }\n      on($(\"#gsvSave\"),\"click\",save);\n      on(f,\"keydown\",function(e){ if(e.key===\"Enter\") save(); });\n    });\n}\n\n/* The full record behind a goal: window, priority, status, both measures, notes. */\nfunction goalEditor(g){\n  gNorm(g);\n  openModal('<h2>Goal details<\u002Fh2>'\n    + '<div class=\"hint\">A goal with no date is a preference. Set the window, name both measures, then leave it alone until the weekly review.<\u002Fdiv>'\n    + '<div class=\"eyebrow\">The goal<\u002Fdiv>'\n    + '<input class=\"fld\" id=\"gdTitle\" value=\"'+esc(g.title)+'\" placeholder=\"What you\\'re committing to\">'\n    + '<div class=\"eyebrow\" style=\"margin-top:14px\">Why it matters<\u002Fdiv>'\n    + '<textarea class=\"fld\" id=\"gdWhy\" placeholder=\"The reason you\\'ll still care in week nine\">'+esc(g.why||\"\")+'<\u002Ftextarea>'\n    + '<div class=\"eyebrow\" style=\"margin-top:14px\">Window<\u002Fdiv>'\n    + '<div class=\"g2\" style=\"gap:8px\">'\n    +   '<label class=\"gdl\">Start<input class=\"fld sm\" id=\"gdStart\" type=\"date\" value=\"'+g.start+'\"><\u002Flabel>'\n    +   '<label class=\"gdl\">Target date<input class=\"fld sm\" id=\"gdDue\" type=\"date\" value=\"'+g.due+'\"><\u002Flabel>'\n    + '<\u002Fdiv>'\n    + '<div class=\"row\" style=\"gap:6px;margin-top:8px\">'\n    +   '<span class=\"hint\" style=\"margin:0;font-size:11.5px\">Quick set:<\u002Fspan>'\n    +   '<button class=\"ghost sm\" data-gh=\"28\">4 weeks<\u002Fbutton>'\n    +   '<button class=\"ghost sm\" data-gh=\"84\">12 weeks<\u002Fbutton>'\n    +   '<button class=\"ghost sm\" data-gh=\"180\">6 months<\u002Fbutton>'\n    + '<\u002Fdiv>'\n    + '<div class=\"eyebrow\" style=\"margin-top:14px\">Classification<\u002Fdiv>'\n    + '<div class=\"g3\" style=\"gap:8px\">'\n    +   '<label class=\"gdl\">Area<input class=\"fld sm\" id=\"gdCat\" value=\"'+esc(g.cat)+'\" placehol n>'\n    + '<button class=\"ghost\" id=\"gdWoop\">Run WOOP<\u002Fbutton>'\n    + '<button class=\"ghost\" data-close style=\"margin-left:auto\">Cancel<\u002Fbutton><\u002Fdiv>',\n  function(root){\n    each(\"[data-gh]\",root,function(b){ on(b,\"click\",function(){\n      var s=$(\"#gdStart\").value||TODAY;\n      $(\"#gdStart\").value=s;\n      $(\"#gdDue\").value=iso(addD(pISO(s),+b.dataset.gh)); });});\n    function save(){\n      g.title=$(\"#gdTitle\").value.trim()||g.title;\n      g.why=$(\"#gdWhy\").value.trim();\n      g.start=$(\"#gdStart\").value||g.start;\n      g.due=$(\"#gdDue\").value||g.due;\n      if(g.due<g.start) g.due=iso(addD(pISO(g.start),GHORIZON));\n      g.cat=$(\"#gdCat\").value.trim().slice(0,40);\n      g.pri=$(\"#gdPri\").value; g.status=$(\"#gdStatus\").value;\n      g.leadN=$(\"#gdLeadN\").value.trim()||g.leadN;\n      g.leadT=clamp(Math.round(+$(\"#gdLeadT\").value||1),1,21);\n      g.lagN=$(\"#gdLagN\").value.trim()||g.lagN;\n      g.lagT=Math.max(1, +$(\"#gdLagT\").value||g.lagT);\n      g.unit=$(\"#gdUnit\").value.trim().slice(0,12);\n      g.notes=$(\"#gdNotes\").value.trim();\n      g.lagC=clamp(g.lagC,0,g.lagT);\n      if(g.status===\"done\") g.lagC=g.lagT;\n      gNorm(g); touch();\n    }\n    on($(\"#gdSave\"),\"click\",function(){ save(); closeModal(); renderGoals(); });\n    on($(\"#gdWoop\"),\"click\",function(){ save(); closeModal(); woop(g); });\n  });\n}\n\nfunction bumpLead(i,d){\n  var g=S.goals[i], ws=iso(wkStart(NOW));\n  if(!S.lead[g.id]) S.lead[g.id]={};\n  S.lead[g.id][ws]=Math.max(0,(S.lead[g.id][ws]||0)+d);\n  touch(); renderGoals();\n}\nfunction woop(g){\n  var i=0;\n  var steps=[\n    {h:\"Wish\", d:\"One meaningful but achievable thing, in three to six words. Not a fantasy — something you could plausibly get in the next twelve weeks.\", f:\"w\", ph:\"Sleep on a fixed schedule\"},\n    {h:\"Outcome\", d:\"Close your eyes for a minute and picture the best realistic result. What does it actually feel like? Sensory detail, not a to-do list. Then write it down.\", f:\"o\", ph:\"Waking up clear-headed, not fighting the alarm…\"},\n    {h:\"Obstacle\", d:\"Not the world — you. What is it <em>in you<\u002Fem> that gets in the way? This is the step people skip, and it's the one that makes the whole thing work. Imagining the good outcome on its own measurably lowers your energy; contrasting it against the real obstacle is what mobilises you.\", f:\"ob\", ph:\"I tell myself I'll do one more thing and it's suddenly 01:00\"},\n    {h:\"Plan\", d:\"One if-then sentence connecting that obstacle to a specific response. Keep the response short — five words or fewer if you can.\", f:\"plan\", ph:\"If it's 22:30 and I'm still on my laptop, then I close it\"}\n  ];\n  openModal(\"\",function(){}); draw();\n  function draw(){\n    var s=steps[i], b=$(\"#modalBody\");\n    b.innerHTML='<div class=\"steps\">'+steps.map(function(_,j){\n        return '<span class=\"stepdot '+(j<i?\"past\":j===i?\"on\":\"\")+'\"><\u002Fspan>';}).join(\"\")+'<\u002Fdiv>'\n      +'<div class=\"stepbody\"><h3>'+s.h+'<\u002Fh3><div class=\"sd\">'+s.d+'<\u002Fdiv>'\n      +'<textarea class=\"fld\" id=\"wf\" placeholder=\"'+esc(s.ph)+'\">'+esc(g[s.f]||\"\")+'<\u002Ftextarea><\u002Fdiv>'\n      +'<div class=\"stepnav\">'+(i>0?'<button class=\"ghost\" id=\"wb\">Back<\u002Fbutton>':\"\")\n      +'<button class=\"primary\" id=\"wn\">'+(i===steps.length-1?\"Save\":\"Next\")+'<\u002Fbutton>'\n      +'<button class=\"ghost\" data-close style=\"margin-left:auto\">Close<\u002Fbutton><\u002Fdiv>';\n    on($(\"#wn\"),\"click\",function(){ g[s.f]=$(\"#wf\").value; touch();\n      if(i===steps.length-1){ if(!g.why) g.why=g.o; closeModal(); renderGoals(); } else { i++; draw(); } });\n    on($(\"#wb\"),\"click\",function(){ g[s.f]=$(\"#wf\").value; i--; draw(); });\n    on(b.querySelector(\"[data-close]\"),\"click\",closeModal);\n  }\n}\n\n/* ══════════ MODAL ══════════ */\nfunction openModal(html,bind){\n  $(\"#modalBody\").innerHT
