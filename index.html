ius:7px;flex:none}\n.att .fi{width:30px;height:30px;border-radius:7px;flex:none;display:flex;align-items:center;justify-content:center;\n  background:var(--surface-3);font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase}\n.att .an{min-width:0;display:flex;flex-direction:column;line-height:1.25}\n.att .an b{font-size:12.5px;font-weight:600;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.att .an i{font-size:11px;font-style:normal;color:var(--muted)}\n.att.bad{border-color:var(--neg)}\n.att.bad .an i{color:var(--neg)}\n.att .ax{flex:none;width:22px;height:22px;border-radius:50%;border:0;background:transparent;\n  color:var(--muted);font-size:15px;line-height:1;cursor:pointer;padding:0}\n.att .ax:hover{background:var(--surface-3);color:var(--ink)}\n.composer{position:relative}\n.plus{flex:none;width:36px;height:36px;border-radius:11px;border:0;\n  background:transparent;color:var(--muted);font-size:0;line-height:0;padding:0;cursor:pointer;\n  display:grid;place-items:center;transition:background .12s,color .12s}\n.plus svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;\n  stroke-linecap:round;stroke-linejoin:round}\n.plus:hover{background:var(--surface-3);color:var(--ink)}\n.plus[aria-expanded=\"true\"]{background:var(--surface-3);color:var(--ink)}\n.plusmenu{position:absolute;bottom:46px;left:0;z-index:40;min-width:232px;border:1px solid var(--border);\n  border-radius:14px;background:var(--surface);box-shadow:var(--shadow-lg);overflow:hidden;display:none}\n.plusmenu.on{display:block}\n.plusmenu button{display:block;width:100%;text-align:left;padding:10px 14px;border:0;\n  background:transparent;color:var(--ink);font-size:13.5px;cursor:pointer;font-family:inherit}\n.plusmenu button:hover{background:var(--surface-2)}\n.plusmenu button small{display:block;color:var(--muted);font-size:11.5px;margin-top:1px}\n.mineatts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}\n.mineatts img{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--border)}\n.mineatts .fc{display:flex;align-items:center;gap:6px;padding:5px 9px;border-radius:9px;\n  background:var(--surface-2);border:1px solid var(--border);font-size:12px;color:var(--muted)}\n.dropz{outline:2px dashed var(--pos);outline-offset:4px;border-radius:16px}\n\n/* ── AI action cards ─────────────────────────────── */\n.acts{margin:8px 0 2px;border:1px solid var(--border);border-radius:14px;background:var(--surface);overflow:hidden}\n.acts .ah{display:flex;align-items:center;gap:7px;padding:9px 12px;background:var(--surface-2);border-bottom:1px solid var(--border);\n  font-size:11.5px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}\n.acts ul{list-style:none;margin:0;padding:6px 12px 8px}\n.acts li{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:13.5px;line-height:1.42;color:var(--ink)}\n.acts li .ai-v{flex:none;width:16px;text-align:center;font-weight:700;color:var(--pos)}\n.acts li.del .ai-v{color:var(--neg)}\n.acts li.fail{color:var(--muted)}\n.acts li.fail .ai-v{color:var(--neg)}\n.acts .af{display:flex;gap:8px;padding:9px 12px 11px;border-top:1px solid var(--border)}\n.acts .af button{flex:1}\n.acts.done{opacity:.9}\n.acts .note{padding:0 12px 10px;font-size:12.5px;color:var(--muted)}\n/* A diff inside an approval card. Added and removed lines are distinguished by a\n   marker as well as by colour, because \"the green ones\" is not a usable instruction\n   for anyone who cannot see the difference between green and red. */\n.acts .dh{display:block;margin-top:4px;font-size:11.5px;color:var(--muted)}\n.acts pre.dfx{margin:5px 0 2px;padding:7px 9px;background:var(--surface-2);border:1px solid var(--border);\n  border-radius:9px;font-size:11.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word;\n  max-height:220px;overflow:auto}\n.acts .di{display:block}\n.acts .di.add{color:var(--pos)}\n.acts .di.del{color:var(--neg)}\n\n/* ── the step timeline ───────────────────────────────\n   Same shell as an action card on purpose: both answer \"what is Compass doing to\n   my stuff\", and giving them one visual language means the timeline reads as part\n   of the conversation rather than as a debug panel bolted underneath it.\n\n   Only existing tokens, so both themes and the Telegram width come for free. */\n.steps{margin:8px 0 2px;border:1px solid var(--border);border-radius:14px;background:var(--surface);overflow:hidden}\n.steps .sh{display:flex;align-items:center;gap:7px;padding:9px 12px;background:var(--surface-2);border-bottom:1px solid var(--border);\n  font-size:11.5px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}\n.steps .sh .el{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500;font-variant-numeric:tabular-nums}\n.steps ol{list-style:none;margin:0;padding:4px 0 6px}\n.steps li{border-top:1px solid var(--border)}\n.steps li:first-child{border-top:0}\n.steps .row{display:flex;gap:8px;align-items:flex-start;width:100%;padding:7px 12px;background:none;border:0;\n  font:inherit;font-size:13.5px;line-height:1.42;color:var(--ink);text-align:left;cursor:default}\n.steps .row.can{cursor:pointer}\n.steps .row.can:hover{background:var(--surface-2)}\n.steps .row:focus-visible{outline:2px solid var(--ink);outline-offset:-2px;border-radius:8px}\n.steps .sv{flex:none;width:16px;text-align:center;font-weight:700;color:var(--pos)}\n.steps li.run .sv{color:var(--muted)}\n.steps li.wait .sv{color:var(--muted);opacity:.6}\n.steps li.bad .sv{color:var(--neg)}\n.steps .st{flex:1;min-width:0}\n.steps .sl{display:block;word-break:break-word}\n.steps .sm{display:block;margin-top:2px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}\n.steps .sm b{font-weight:600;color:var(--muted)}\n.steps .sd{flex:none;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}\n.steps pre.sr{margin:0;padding:8px 12px 12px;background:var(--surface-2);border-top:1px solid var(--border);\n  font-size:11.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word;color:var(--muted);max-height:260px;overflow:auto}\n.steps .snote{padding:8px 12px 10px;font-size:12.5px;color:var(--muted)}\n/* A dot that pulses only while something is actually running, and not at all for\n   anyone who has asked the system to stop animating things. */\n.steps li.run .sv i{display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;animation:stepPulse 1.1s ease-in-out infinite}\n@keyframes stepPulse{0%,100%{opacity:.35}50%{opacity:1}}\n@media (prefers-reduced-motion: reduce){.steps li.run .sv i{animation:none;opacity:.8}}\n/* Announced, not shown. The log itself is a live region, but it is rebuilt whole on\n   every repaint, so it cannot be relied on to announce a single step changing\n   state — a rebuilt region either says everything again or says nothing. This is a\n   separate, tiny region that only ever holds one sentence about progress. */\n.sronly{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}\n\n/* ── the computer-control indicator ──────────────────\n   Every other control in this feature limits what the agent may do. This one limits\n   what can happen without him knowing, and it is the difference between \"I let it do\n   that\" and \"why did my mouse just move\". So it is a full-width bar with a live\n   countdown and a stop button rather than a dot in a corner: the requirement is that he\n   is never unsure whether the agent can move his mouse, and a subtle indicator fails\n   that requirement by being subtle.\n\n   --neg for the background, which is the colour this file already uses for destructive\n   things, so it reads as \"something consequential is switched on\" without inventing a\n   token. */\n.pcbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:0 0 8px;padding:9px 12px;\n  border:1px solid var(--neg);border-radius:12px;background:color-mix(in srgb, var(--neg) 12%, var(--surface));\n  font-size:12.5px;color:var(--ink)}\n.pcbar b{font-weight:650}\n.pcbar .pcdot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--neg);\n  animation:pcPulse 1.4s ease-in-out infinite}\n.pcbar .pcleft{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:650}\n.pcbar .pcsteps{color:var(--muted)}\n.pcbar .pchint{color:var(--muted);font-size:11.5px;width:100%}\n.pcbar .pcstop{flex:none;padding:5px 11px;border-radius:9px;border:1px solid var(--neg);\n  background:var(--neg);color:var(--surface);font:inherit;font-size:12px;font-weight:650;cursor:pointer}\n.pcbar .pcstop:hover{filter:brightness(1.08)}\n.pcbar .pcstop:focus-visible{outline:2px solid var(--ink);outline-offset:2px}\n@keyframes pcPulse{0%,100%{opacity:.45}50%{opacity:1}}\n/* Reduced motion keeps the bar and loses the pulse. The bar is the information; the\n   movement is only what draws the eye to it. */\n@media (prefers-reduced-motion: reduce){.pcbar .pcdot{animation:none;opacity:1}}\n\n/* ── the transparency footer and result cards ────────\n   Both are quiet on purpose: --muted, small, and below the answer. What that answer cost\n   is worth being able to see and not worth competing with the answer for attention. */\n.ufoot{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin:6px 0 0;\n  font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}\n.ufoot .um{margin-left:auto;opacity:.85}\n.rcard{margin:0;padding:8px 12px;border-top:1px solid var(--border);background:var(--surface)}\nul.rlist{list-style:none;font-size:12.5px;line-height:1.5;max-height:220px;overflow:auto}\nul.rlist li{padding:1px 0;color:var(--ink);word-break:break-word}\nul.rlist li.fold{font-weight:600}\nul.rlist li i{color:var(--muted);font-style:normal;font-size:11.5px}\nul.rlist li.rmore{color:var(--muted)}\n.rshot{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}\n.rshot svg{flex:none;width:15px;height:15px}\n\n/* ── the slash palette, search results, and the jump highlight ───── */\n.palette{display:none;margin:0 0 7px;border:1px solid var(--border);border-radius:12px;\n  background:var(--surface);overflow:hidden;max-height:240px;overflow-y:auto}\n.palette.on{display:block}\n.palette .pitem{display:flex;align-items:baseline;gap:9px;width:100%;padding:8px 12px;\n  background:none;border:0;border-top:1px solid var(--border);font:inherit;font-size:13px;\n  color:var(--ink);text-align:left;cursor:pointer}\n.palette .pitem:first-child{border-top:0}\n.palette .pitem.on,.palette .pitem:hover{background:var(--surface-2)}\n.palette .pitem b{font-weight:650;font-variant-numeric:tabular-nums}\n.palette .pitem small{color:var(--muted);font-size:11.5px}\n\n.dsearch{padding:0 12px 8px}\n.shits{display:flex;flex-direction:column}\n.shit{display:flex;flex-direction:column;gap:2px;width:100%;padding:8px 12px;background:none;\n  border:0;border-top:1px solid var(--border);font:inherit;text-align:left;cursor:pointer}\n.shit:hover{background:var(--surface-2)}\n.shit .sh1{font-size:11.5px;color:var(--muted)}\n.shit .sh2{font-size:12.5px;line-height:1.45;color:var(--ink);word-break:break-word}\n.shit mark{background:color-mix(in srgb, var(--pos) 30%, transparent);color:inherit;border-radius:3px}\n\n/* Where the search sent him. Fades rather than persisting: it answers \"which one\" and\n   then gets out of the way. */\n.turn.found>.tbody{outline:2px solid var(--pos);outline-offset:4px;border-radius:10px;\n  transition:outline-color .9s ease}\n@media (prefers-reduced-motion: reduce){.turn.found>.tbody{transition:none}}\n\n/* ═══ REDESIGN · HEADER + TODAY ═════════════════════════════════════════ */\n.wrap{max-width:1120px}\nheader{padding:26px 0 14px}\n.brandrow{align-items:center;gap:18px}\n.brand h1{font-size:19px;gap:11px;letter-spacing:-.02em}\n.brand h1 .mark{flex:none;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;\n  background:linear-gradient(160deg,var(--surface-3),var(--surface-2));border:1px solid var(--border);\n  box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}\n.brand h1 .mark svg{width:18px;height:18px;color:var(--d1)}\n.brand .sub{font-size:12px;color:var(--muted);margin-top:5px;font-variant-numeric:tabular-nums}\n.hbtns .ghost{border-radius:9px;padding:7px 12px;font-size:12px}\n.hbtns .ghost.key{background:var(--ink);color:var(--plane);border-color:var(--ink);font-weight:600}\n.hbtns .ghost.key:hover{background:var(--ink);opacity:.88;color:var(--plane)}\nnav{background:color-mix(in srgb,var(--plane) 86%,transparent);backdrop-filter:blur(14px);\n  -webkit-backdrop-filter:blur(14px);margin-bottom:26px}\n.tabs{gap:2px;padding:2px 0}\n.tab{padding:11px 13px;font-size:12.5px;border-bottom-width:2px}\n.tab[aria-selected=\"true\"]{border-bottom-color:var(--d1)}\n\n.card.hero-card{padding:0;overflow:hidden;background:\n  radial-gradient(120% 140% at 0% 0%,color-mix(in srgb,var(--d1) 16%,transparent) 0%,transparent 60%),\n  color-mix(in srgb,var(--surface) 72%,transparent)}\n.hero{align-items:center;gap:28px;padding:24px 22px 20px}\n.gauge{width:150px;height:150px}\n.gauge .num b{font-size:40px;font-variant-numeric:tabular-nums}\n.herotxt .band{font-size:22px;letter-spacing:-.02em;margin-bottom:7px}\n.herotxt p{font-size:14px;max-width:58ch;text-wrap:pretty}\n.hero-card .breakdown{margin:0;padding:16px 22px 6px;border-top:1px solid var(--border);gap:11px}\n.hero-card .bd{grid-template-columns:88px 1fr auto;font-size:12px}\n.hero-card .bd .k{color:var(--muted);text-transform:uppercase;letter-spacing:.06em;\n  font-size:10.5px;font-weight:700}\n\ndetails.why{border-top:1px solid var(--border);margin:14px -20px -20px;padding:0 20px}\ndetails.why[open]{padding-bottom:14px}\n.hero-card details.why{margin:10px 0 0;padding:0 22px}\n.hero-card details.why[open]{padding-bottom:16px}\ndetails.why>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:7px;\n  padding:11px 0;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;\n  color:var(--muted);transition:color .12s}\ndetails.why>summary::-webkit-details-marker{display:none}\ndetails.why>summary::marker{content:\"\"}\ndetails.why>summary:hover{color:var(--ink-2)}\ndetails.why>summary::before{content:\"\";width:5px;height:5px;border-right:1.5px solid currentColor;\n  border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .15s}\ndetails.why[open]>summary::before{transform:rotate(45deg)}\ndetails.why .src{max-width:76ch;text-wrap:pretty;font-size:12px}\n\n.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;\n  margin:26px 0 11px;padding:0 2px}\n.sechead .t{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}\n#s-today .card>h2{font-size:15.5px;letter-spacing:-.012em}\n#s-today .card>.hint{font-size:12px;margin-bottom:14px;max-width:70ch;text-wrap:pretty}\n\n#todoCard .tdadd{gap:7px;background:var(--surface-2);border:1px solid var(--border);\n  border-radius:11px;padding:7px;margin-top:0}\n#todoCard .tdadd .fld{background:transparent;font-size:14px}\n#todoCard .tdadd .fld:focus{border-color:transparent;background:transparent}\n#todoCard .tdadd select.fld{background-color:var(--surface-3);font-size:12px;border-radius:8px}\n#todoCard .tdadd button{background:var(--d1);color:#fff;border-color:transparent;font-weight:600;\n  border-radius:8px;padding:8px 15px}\n#todoCard .tdadd button:hover{background:var(--d1);opacity:.9;color:#fff}\n#todoCard .cap{height:8px;border-radius:99px;margin:10px 0 9px}\n#todoCard .cap i{border-radius:99px}\n#todoCard .cap b{display:none}\n.caprow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:16px}\n.caprow .eyebrow{margin:0}\n\n.card.blockcard{background:var(--surface);border-color:color-mix(in srgb,var(--d1) 22%,var(--border))}\n.card.blockcard .eyebrow{color:var(--d1)}\n#todayTimer{font-variant-numeric:tabular-nums}\n@media(max-width:640px){\n  header{padding:18px 0 10px}\n  .hero{gap:18px;padding:20px 16px 16px}\n  .gauge{width:112px;height:112px}\n  .gauge .num b{font-size:32px}\n  .herotxt .band{font-size:18px}\n  .hero-card .breakdown{padding:14px 16px 4px}\n  .hero-card details.why{padding-left:16px;padding-right:16px}\n  .card{padding:16px}\n  details.why{margin:12px -16px -16px;padding:0 16px}\n  #todoCard .tdadd{flex-wrap:wrap}\n  #todoCard .tdadd .fld{flex:1 1 100%}\n}\n\n/* ═══ REDESIGN v2 · BLURRED FIELD + TWO-COLUMN TODAY ════════════════════ */\nbody{position:relative;isolation:isolate}\nbody::before{content:\"\";position:fixed;inset:-20vmax;z-index:-2;pointer-events:none;\n  background:\n    radial-gradient(38vmax 32vmax at 12% 6%, color-mix(in srgb,var(--d1) 40%,transparent), transparent 68%),\n    radial-gradient(34vmax 30vmax at 88% 12%, color-mix(in srgb,var(--d5) 26%,transparent), transparent 70%),\n    radial-gradient(42vmax 36vmax at 72% 88%, color-mix(in srgb,var(--d3) 24%,transparent), transparent 72%),\n    radial-gradient(30vmax 26vmax at 26% 82%, color-mix(in srgb,var(--d4) 18%,transparent), transparent 70%);\n  filter:blur(90px) saturate(130%);opacity:.9}\nbody::after{content:\"\";position:fixed;inset:0;z-index:-1;pointer-events:none;\n  background:color-mix(in srgb,var(--plane) 28%,transparent);backdrop-filter:blur(40px);\n  -webkit-backdrop-filter:blur(40px)}\n:root[data-theme=\"light\"] body::before{opacity:.5}\n\n.card{background:color-mix(in srgb,var(--surface) 72%,transparent);\n  backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);\n  border-color:color-mix(in srgb,var(--ink) 9%,transparent)}\nnav{background:color-mix(in srgb,var(--plane) 62%,transparent)}\n\n/* the day bar — one line that answers \"push or protect\" before anything else */\n.daybar{display:flex;align-items:center;gap:18px;padding:14px 18px;margin-bottom:16px;\n  border:1px solid color-mix(in srgb,var(--ink) 10%,transparent);border-radius:15px;\n  background:color-mix(in srgb,var(--surface) 66%,transparent);\n  backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);\n  box-shadow:var(--shadow)}\n.dbscore{display:flex;flex-direction:column;line-height:1;flex:none}\n.dbscore span{font-size:29px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}\n.dbscore small{font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;\n  color:var(--muted);margin-top:6px}\n.dbsep{width:1px;align-self:stretch;background:var(--border);flex:none}\n.dbmain{flex:1;min-width:0}\n.dbband{font-size:14px;font-weight:600;letter-spacing:-.01em}\n.dbnote{font-size:12px;color:var(--ink-2);margin-top:3px;overflow:hidden;text-overflow:ellipsis;\n  white-space:nowrap}\n.dbacts{flex:none}\n\n/* two columns: the work on the left, the day's instruments on the right */\n.tgrid{display:grid;grid-template-columns:minmax(0,1.62fr) minmax(288px,.95fr);gap:16px;\n  align-items:start}\n.tmain{min-width:0}\n.trail{min-width:0;position:sticky;top:60px;display:flex;flex-direction:column;gap:15px}\n.trail .card{margin-bottom:0}\n.trail .anchors{grid-template-columns:1fr}\n@media(max-width:1000px){\n  .tgrid{grid-template-columns:1fr}\n  .trail{position:static}\n  .trail .anchors{grid-template-columns:repeat(auto-fit,minmax(158px,1fr))}\n}\n@media(max-width:640px){\n  .daybar{gap:13px;padding:12px 14px;border-radius:13px}\n  .dbscore span{font-size:24px}\n  .dbacts{display:none}\n}\n\n/* One column by default; the wide block below widens them once there is room. */\n.cigrid,.ntgrid{display:grid;grid-template-columns:1fr;gap:15px;align-items:start}\n.cigrid>.card,.ntgrid>.card,\nbody.tg .cigrid>.card,body.tg .ntgrid>.card{margin-bottom:0}\n\n/* ═══ WIDE SCREENS ═════════════════════════════════════════════\n   The shell adds body.tg on every platform, not just inside Telegram, so a\n   desktop window was getting the phone layout: every .g2 and .g3 collapsed to\n   one column inside a 1120px column, which on a 1080p screen is a stripe of\n   cards down the middle and two empty thirds either side. These rules hand the\n   width back once there is width to hand back. The phone case is untouched —\n   everything here is behind a min-width the phone never reaches. */\n@media(min-width:1180px){\n  .wrap{max-width:1480px}\n  body.tg .wrap{padding:0 26px calc(var(--tgnav) + var(--tgsafe) + 28px)}\n\n  /* the paired and tripled card rows the phone layout had flattened */\n  body.tg .g2{grid-template-columns:1fr 1fr;gap:16px}\n  body.tg .g3{grid-template-columns:repeat(3,1fr);gap:16px}\n  body.tg .card{padding:19px 20px;margin-bottom:16px}\n  body.tg .tiles{grid-template-columns:repeat(auto-fit,minmax(122px,1fr))}\n  body.tg .hg{min-width:0}\n  body.tg .hgwrap{overflow-x:visible}\n\n  /* Readiness spans the top; the gauge and the breakdown sit side by side\n     rather than stacked, which is most of the height the card used to waste. */\n  .card.hero-card{display:grid;grid-template-columns:minmax(0,1fr) minmax(290px,.58fr);\n    align-items:stretch}\n  .hero-card .hero{padding:22px 24px}\n  .hero-card .breakdown{margin:0;padding:20px 24px;border-top:0;\n    border-left:1px solid var(--border);justify-content:center}\n  .hero-card details.why{grid-column:1/-1;border-top:1px solid var(--border);\n    margin:0;padding:0 24px}\n\n  /* the work on the left, the day's instruments on the right */\n  .tgrid{grid-template-columns:minmax(0,1.62fr) minmax(330px,.9fr);gap:18px}\n  .trail{top:18px}\n\n  /* Check-in, anchors and the evening log side by side */\n  .cigrid{grid-template-columns:minmax(0,1.2fr) minmax(280px,.8fr)}\n\n  /* Notes: the form stays put on the left while the list scrolls past it */\n  .ntgrid{grid-template-columns:minmax(330px,.82fr) minmax(0,1.3fr)}\n  .ntgrid>.card:first-child{position:sticky;top:18px}\n}\n\n@media(min-width:1400px){\n  .cigrid{grid-template-columns:minmax(0,1.18fr) minmax(280px,.76fr) minmax(0,1.06fr)}\n}\n\n@media(min-width:1620px){\n  .wrap{max-width:1560px}\n  .tgrid{grid-template-columns:minmax(0,1.72fr) minmax(360px,.86fr)}\n}\n\n/* ═══ TO-DO ROW ALIGNMENT ══════════════════════════════════════\n   Two rules downstream of .td were quietly undoing it.\n\n   `body.tg .line{padding:11px 0}` is a shorthand, so it reset the\n   `padding-left:11px` that .td relies on to clear its priority stripe. The\n   stripe is absolute at left:0, so with no padding it drew *underneath* the\n   checkbox — the checkbox has a solid background, so what showed was a 3px\n   slice poking out from behind it.\n\n   The indent under the checkbox was hardcoded at 30px, which is right for a\n   21px box plus the 9px flex gap — but the shell scales the box up to 26px, so\n   the if-then field sat 5px left of the task name it belongs under. Deriving it\n   from the box size keeps the two in step if either changes again. */\n.td{--tdindent:30px}\nbody.tg .td{--tdindent:35px}\nbody.tg .line.td{padding-left:11px}\n.tdplan{margin-left:var(--tdindent);width:calc(100% - var(--tdindent))}\n.tdplantxt{margin-left:var(--tdindent)}\n\n/* ═══ TIMER ════════════════════════════════════════════════════════\n   The dial, the shape of the session, and the clock while it runs. */\n\n/* ── setting the length ── */\n/* A timer is a small instrument. Left to fill a 1400px card it stops reading as\n   one, so both states keep to a fixed measure and centre in whatever they sit\n   in — the narrow Today column or the full-width Focus tab. */\n.fdial{border:1px solid var(--border);border-radius:16px;padding:16px 16px 14px;\n  background:linear-gradient(180deg,color-mix(in srgb,var(--d1) 7%,var(--surface)) 0%,var(--surface) 62%);\n  margin:14px auto 13px;max-width:460px}\n.fLiveCard>.gauge,.fLiveCard>.fmeta,.fLiveCard>.fmap,\n.fLiveCard>.fstats,.fLiveCard>.fbtns{max-width:460px;margin-left:auto;margin-right:auto}\n.fSessionBox .fdial{margin:8px auto 11px;padding:14px 13px 12px}\n.fstep{margin:2px 0 12px;gap:16px}\n.fstep button{width:42px;height:42px;background:var(--surface);border:1px solid var(--border);\n  color:var(--ink-2);box-shadow:var(--shadow)}\n.fstep button:hover:not(:disabled){border-color:var(--d1);color:var(--d1)}\n.fstep button:active:not(:disabled){transform:scale(.93)}\n.fnum{min-width:124px;border:0;background:none;padding:0}\n.fnum b{font-size:44px;letter-spacing:-.035em;font-variant-numeric:tabular-nums;\n  background:linear-gradient(170deg,var(--ink) 40%,color-mix(in srgb,var(--d1) 55%,var(--ink)) 100%);\n  -webkit-background-clip:text;background-clip:text;color:transparent}\n.fnum span{margin-top:2px;font-size:9.5px}\n\n/* quick lengths — the four or five you actually use */\n.fpre{display:flex;justify-content:center;gap:5px;flex-wrap:wrap;margin-bottom:13px}\n.fpre button{padding:4px 11px;border-radius:999px;font-size:11.5px;font-weight:600;\n  border:1px solid var(--border);background:var(--surface);color:var(--muted);\n  font-variant-numeric:tabular-nums;transition:all .12s}\n.fpre button:hover{border-color:var(--axis);color:var(--ink-2)}\n.fpre button[aria-pressed=\"true\"]{background:var(--ink);color:var(--plane);border-color:var(--ink)}\n\n/* ── the session, to scale ──\n   Wide bars are deep work, the narrow dashed ones are breaks, each sized by its\n   real length. It is the one place the shape of the next two hours is visible\n   at a glance rather than described in a sentence. */\n.fmap{display:flex;align-items:stretch;gap:4px;height:26px;margin:0 0 11px}\n.fSessionBox .fmap{height:22px}\n.fseg{position:relative;flex:1;min-width:7px;border-radius:6px;overflow:hidden;\n  border:1px solid var(--border);background:var(--surface-2)}\n.fseg.br{background:transparent;border-style:dashed;border-color:var(--axis);opacity:.7}\n.fseg .fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:5px 0 0 5px;\n  background:color-mix(in srgb,var(--d3) 78%,transparent);transition:width .95s linear}\n.fseg.br .fill{background:color-mix(in srgb,var(--d1) 62%,transparent)}\n.fseg em{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;\n  font-size:10px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;\n  letter-spacing:.02em}\n.fseg.cur{border-color:color-mix(in srgb,var(--d3) 55%,var(--border));\n  box-shadow:0 0 0 2px color-mix(in srgb,var(--d3) 16%,transparent)}\n.onbreak .fseg.cur{border-color:color-mix(in srgb,var(--d1) 55%,var(--border));\n  box-shadow:0 0 0 2px color-mix(in srgb,var(--d1) 16%,transparent)}\n.fseg.was em{color:var(--plane);opacity:.8}\n\n.fplan{margin-bottom:4px;font-size:12.5px}\n.fends{text-align:center;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}\n.fends b{color:var(--ink-2);font-weight:600}\n\n/* ── the clock while it runs ── */\n.gauge.fring{margin-left:auto;margin-right:auto}\n.gauge.fring .num b{letter-spacing:-.02em}\n.gauge.fring .num span{font-size:9px;margin-top:6px}\n.fLiveCard>.fmap{margin-top:15px}\n/* A ring that stops moving needs to look stopped, or a paused session reads as\n   a broken one. */\n.fLiveCard.ispaused .gauge.fring svg{opacity:.42}\n.fLiveCard.ispaused .num b{color:var(--muted)}\n.fLiveCard.ispaused .num span{color:var(--warn)}\n\n.fstats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--grid);\n  border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-top:2px}\n.fstats>div{background:var(--surface);padding:9px 6px;text-align:center;min-width:0}\n.fSessionBox .fstats>div{background:var(--surface)}\n.fstats b{display:block;font-size:14.5px;font-weight:600;line-height:1.2;letter-spacing:-.015em;\n  font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.fstats span{display:block;font-size:9px;color:var(--muted);text-transform:uppercase;\n  letter-spacing:.07em;font-weight:700;margin-top:4px}\n\n.fmeta .fwhat{margin-top:11px}\n.fbtns{margin-top:14px}\n\n@media(prefers-reduced-motion:reduce){\n  .fseg .fill{transition:none}\n  .fstep button:active:not(:disabled){transform:none}\n}\n\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<script id=\"state-data\" type=\"application/json\">null<\u002Fscript>\n<div class=\"wrap\">\n\n<header>\n  <div class=\"brandrow\">\n    <div class=\"brand\">\n      <h1><span class=\"mark\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><polygon points=\"16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76\"><\u002Fpolygon><\u002Fsvg><\u002Fspan>Compass<\u002Fh1>\n      <div class=\"sub\" id=\"subline\">—<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"hbtns\">\n      <button class=\"ghost\" id=\"stuckBtn\">I'm stuck<\u002Fbutton>\n      <button class=\"ghost\" id=\"minBtn\">Minimum day<\u002Fbutton>\n      <button class=\"ghost\" id=\"themeBtn\">Light<\u002Fbutton>\n      <button class=\"ghost key\" id=\"saveBtn\">Save<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<nav><div class=\"tabs\" role=\"tablist\" id=\"tabs\"><\u002Fdiv><\u002Fnav>\n\n<!-- ═══════════════ TODAY ═══════════════ -->\n<section id=\"s-today\">\n\n  <div class=\"card hero-card\">\n    <div class=\"hero\">\n      <div class=\"gauge\" id=\"gauge\"><\u002Fdiv>\n      <div class=\"herotxt\">\n        <div class=\"eyebrow\" style=\"margin-bottom:7px\">Readiness<\u002Fdiv>\n        <div class=\"band\" id=\"rBand\">—<\u002Fdiv>\n        <p id=\"rText\">—<\u002Fp>\n        <div class=\"row\" style=\"margin-top:13px\">\n          <button class=\"ghost sm\" id=\"dbJump\">Go to deep block<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"breakdown\" id=\"rBreak\"><\u002Fdiv>\n    <details class=\"why\">\n      <summary>What this number is<\u002Fsummary>\n      <div class=\"src\">A capacity estimate, not a grade. Its only job is to tell you whether today is a day to push or a day to protect. Modelled on the readiness scores used by Oura and WHOOP.<\u002Fdiv>\n    <\u002Fdetails>\n  <\u002Fdiv>\n\n  <div class=\"tgrid\">\n    <div class=\"tmain\">\n\n      <div class=\"card\" id=\"todoCard\">\n        <div class=\"spread\" style=\"margin-bottom:14px\">\n          <h2>To-do<\u002Fh2>\n          <div class=\"row\" style=\"gap:5px;flex:none\">\n            <button class=\"ghost sm\" id=\"todoSort\">Sort: my order<\u002Fbutton>\n            <button class=\"ghost sm\" id=\"focusBtn\">Focus mode<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div id=\"todoStat\"><\u002Fdiv>\n\n        <div class=\"tdadd\">\n          <input class=\"fld\" id=\"todoNew\" placeholder=\"Add something and press Enter\">\n          <select class=\"fld sm\" id=\"todoNewPri\" title=\"Priority\">\n            <option value=\"hi\">High<\u002Foption><option value=\"md\" selected=\"\">Medium<\u002Foption><option value=\"lo\">Low<\u002Foption>\n          <\u002Fselect>\n          <select class=\"fld sm\" id=\"todoNewMins\" title=\"Time estimate\">\n            <option value=\"15\">15m<\u002Foption><option value=\"30\">30m<\u002Foption><option value=\"45\">45m<\u002Foption>\n            <option value=\"60\" selected=\"\">1h<\u002Foption><option value=\"90\">1.5h<\u002Foption><option value=\"120\">2h<\u002Foption><option value=\"180\">3h<\u002Foption>\n          <\u002Fselect>\n          <button class=\"ghost\" id=\"todoAdd\">Add<\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"tdsyn\">Shortcuts while typing: <code>!<\u002Fcode> at the end for high priority, <code>~<\u002Fcode> for low, <code>45m<\u002Fcode> or <code>2h<\u002Fcode> to set the estimate.<\u002Fdiv>\n\n        <div class=\"pills\" id=\"todoFilters\" style=\"margin-top:14px\"><\u002Fdiv>\n        <div id=\"todoList\"><\u002Fdiv>\n        <div id=\"todoStale\"><\u002Fdiv>\n\n        <div class=\"caprow\"><div class=\"eyebrow\">Today's load<\u002Fdiv><\u002Fdiv>\n        <div class=\"cap\" id=\"capBar\"><i><\u002Fi><b><\u002Fb><\u002Fdiv>\n        <div class=\"capnote\" id=\"capNote\"><\u002Fdiv>\n\n        <details class=\"why\">\n          <summary>How this list is meant to work<\u002Fsummary>\n          <div class=\"src\">Today's committed list sits at the top, everything else waits behind it. Each item carries an honest time estimate and an <b>if-then plan<\u002Fb> — not because it's tidy, but because deciding <em>when and where<\u002Fem> is the specific thing that stops an unfinished task occupying your head all day. Writing it down alone doesn't do it.<\u002Fdiv>\n        <\u002Fdetails>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n\n    <aside class=\"trail\" id=\"trail\">\n      <div class=\"card blockcard\" id=\"blockCard\">\n        <div class=\"spread\" style=\"align-items:baseline;margin-bottom:12px\">\n          <div class=\"eyebrow\" style=\"margin:0\">Deep block<\u002Fdiv>\n          <span class=\"src\" id=\"tToday\"><\u002Fspan>\n        <\u002Fdiv>\n        <div id=\"todayTimer\"><\u002Fdiv>\n        <div class=\"gate\" id=\"gate\"><\u002Fdiv>\n        <label class=\"lbl\" style=\"margin-top:4px\">The one question this block answers<\u002Flabel>\n        <input class=\"fld sm\" id=\"blockQ\" placeholder=\"Not &quot;revise Chemistry&quot; — &quot;do the 8 equilibrium questions&quot;\">\n        <details class=\"why\">\n          <summary>Phone in another room<\u002Fsummary>\n          <div class=\"src\">A silenced phone on the desk still costs you working memory — the effect shows up whether it's on, off, or face down. Only distance removes it.<\u002Fdiv>\n        <\u002Fdetails>\n      <\u002Fdiv>\n\n      <div class=\"card\">\n        <div class=\"eyebrow\">Check-in &amp; anchors<\u002Fdiv>\n        <div class=\"hint\" style=\"margin-bottom:11px\">Mood, sleep, energy and the five anchors now live on their own screen — More → Check-in.<\u002Fdiv>\n        <div class=\"row\"><button class=\"ghost sm\" id=\"goCheckin\">Open the check-in<\u002Fbutton><\u002Fdiv>\n        <div class=\"src\" id=\"ciMini\" style=\"margin-top:10px\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Faside>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════════════ WEEK ═══════════════ -->\n<section id=\"s-week\">\n  <div class=\"card\">\n    <div class=\"spread\" style=\"margin-bottom:3px\">\n      <h2>Execution score<\u002Fh2>\n      <span class=\"chip\" id=\"wkLabel\">—<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"hint\">The share of what you planned this week that you actually did. Around <b>85%<\u002Fb> is the level that reliably delivers a 12-week goal — chasing 100% every week is how people burn out and quit.<\u002Fdiv>\n    <div class=\"exec\" id=\"execBar\"><i><\u002Fi><b><\u002Fb><span class=\"line85\"><\u002Fspan><span class=\"lb85\">85%<\u002Fspan><\u002Fdiv>\n    <div class=\"tiles\" style=\"margin-top:15px\" id=\"weekTiles\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"card\">\n    <h2>Habits<\u002Fh2>\n    <div class=\"hint\">Tap once for <b>done<\u002Fb>, twice for a <b>deliberate skip<\u002Fb> (amber — a planned rest day is not a failure), three times to clear. The strength bar is an average that dips when you miss and recovers when you return; it never resets to zero, because missing one day genuinely doesn't undo a habit.<\u002Fdiv>\n    <div class=\"hgwrap\"><table class=\"hg\" id=\"habitGrid\"><\u002Ftable><\u002Fdiv>\n    <div class=\"legend\">\n      <span class=\"sw\" style=\"background:var(--d1)\"><\u002Fspan><span>Done<\u002Fspan>\n      <span class=\"sw\" style=\"background:var(--warn);margin-left:8px\"><\u002Fspan><span>Deliberate skip<\u002Fspan>\n      <span class=\"sw\" style=\"background:var(--surface-2);border:1px solid var(--axis);margin-left:8px\"><\u002Fspan><span>Missed or not yet<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"card\">\n    <h2>The long view<\u002Fh2>\n    <div class=\"hint\">One square per day, one column per week. Darker means more done. This is the chart that matters — not any single day in it.<\u002Fdiv>\n    <div class=\"heat\" id=\"heat\"><\u002Fdiv>\n    <div class=\"legend\">\n      <span>Less<\u002Fspan>\n      <span class=\"sw\" style=\"background:var(--s0)\"><\u002Fspan><span class=\"sw\" style=\"background:var(--s1)\"><\u002Fspan>\n      <span class=\"sw\" style=\"background:var(--s2)\"><\u002Fspan><span class=\"sw\" style=\"background:var(--s3)\"><\u002Fspan>\n      <span class=\"sw\" style=\"background:var(--s4)\"><\u002Fspan><span class=\"sw\" style=\"background:var(--s5)\"><\u002Fspan>\n      <span>More<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"g2\">\n    <div class=\"card\">\n      <h2>Sleep &amp; energy<\u002Fh2>\n      <div class=\"hint\">Last 21 days. You're looking for the relationship, not the numbers.<\u002Fdiv>\n      <div id=\"sleepChart\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"card\">\n      <h2>What moves your mood<\u002Fh2>\n      <div class=\"hint\">Average mood on days you did each habit, minus days you didn't. Needs a couple of weeks of data before it says anything real.<\u002Fdiv>\n      <div id=\"corrChart\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"card\">\n    <h2>Manage your habits<\u002Fh2>\n    <div class=\"hint\">A cap of seven is deliberate. Each one needs an <b>anchor<\u002Fb> (an existing moment that reliably happens) and a <b>two-minute version<\u002Fb> for bad days. A habit with no anchor is a wish.<\u002Fdiv>\n    <div id=\"habitList\"><\u002Fdiv>\n    <div class=\"divider\"><\u002Fdiv>\n    <div class=\"eyebrow\">Add a habit<\u002Fdiv>\n    <div class=\"g3\" style=\"gap:8px\">\n      <input class=\"fld sm\" id=\"nhName\" placeholder=\"Habit\">\n      <input class=\"fld sm\" id=\"nhAnchor\" placeholder=\"After I… (anchor moment)\">\n      <input class=\"fld sm\" id=\"nhTiny\" placeholder=\"Two-minute version\">\n    <\u002Fdiv>\n    <div class=\"row\" style=\"margin-top:9px\">\n      <label class=\"lbl\" style=\"margin:0\">Target<\u002Flabel>\n      <select class=\"fld sm\" id=\"nhTarget\" style=\"width:auto\">\n        <option value=\"7\">7× a week<\u002Foption><option value=\"5\">5× a week<\u002Foption>\n        <option value=\"4\">4× a week<\u002Foption><option value=\"3\" selected=\"\">3× a week<\u002Foption>\n        <option value=\"2\">2× a week<\u002Foption><option value=\"1\">1× a week<\u002Foption>\n      <\u002Fselect>\n      <button class=\"ghost sm\" id=\"addHabit\">Add<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"card\">\n    <h2>Where things stand<\u002Fh2>\n    <div class=\"hint\">Rate each area on gut feeling. Direction, not accuracy. Once a week, Sunday. Your attention this week goes to the lowest bar — one area, not six.<\u002Fdiv>\n    <div class=\"bars\" id=\"domBars\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"g2\" id=\"domCards\"><\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════════════ SCHOOL ═══════════════ -->\n<section id=\"s-school\">\n  <div class=\"card\">\n    <h2>May 2027<\u002Fh2>\n    <div class=\"hint\">Your session. Every date below marked <span class=\"chip est\">est.<\u002Fspan> is triangulated from schools that have published their May 2027 calendars — <b>confirm all of them with your DP coordinator<\u002Fb>, because each school sets its own internal deadlines.<\u002Fdiv>\n    <div class=\"tiles\" id=\"ibTiles\"><\u002Fdiv>\n    <div class=\"callout warm\" style=\"margin-top:16px\">\n      <b>One thing worth knowing early:<\u002Fb> the Extended Essay was fully redesigned for first assessment in <b>May 2027<\u002Fb> — your year is the first cohort. New criteria (A–E, 30 marks instead of 34), a single ≤500-word reflective statement instead of three, and a new interdisciplinary pathway option. Guidance from anyone who sat the EE before your session is out of date.\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"card\">\n    <div class=\"spread\" style=\"margin-bottom:3px\">\n      <h2>Deadlines &amp; milestones<\u002Fh2>\n      <div class=\"pills\" style=\"margin:0\" id=\"msFilter\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"hint\">The number beside a deferred item counts the days you've been moving it. It only clears when the thing is done.<\u002Fdiv>\n    <div id=\"milestones\"><\u002Fdiv>\n    <div class=\"divider\"><\u002Fdiv>\n    <div class=\"g3\" style=\"gap:8px\">\n      <input class=\"fld sm\" id=\"msTitle\" placeholder=\"What's due\">\n      <select class=\"fld sm\" id=\"msSubject\"><\u002Fselect>\n      <input class=\"fld sm\" id=\"msDate\" type=\"date\">\n    <\u002Fdiv>\n    <div class=\"row\" style=\"margin-top:9px\">\n      <select class=\"fld sm\" id=\"msType\" style=\"width:auto\">\n        <option value=\"IA\">IA<\u002Foption><option value=\"EE\">EE<\u002Foption><option value=\"TOK\">TOK<\u002Foption>\n        <option value=\"CAS\">CAS<\u002Foption><option value=\"Test\">Test<\u002Foption>\n        <option value=\"Aflevering\" selected=\"\">Aflevering<\u002Foption><option value=\"Exam\">Exam<\u002Foption>\n      <\u002Fselect>\n      <button class=\"ghost sm\" id=\"addMs\">Add<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"g2\">\n    <div class=\"card\">\n      <h2>Subjects<\u002Fh2>\n      <div class=\"hint\">Bars show study time logged this week. You will notice you avoid one of them.<\u002Fdiv>\n      <div id=\"subjects\"><\u002Fdiv>\n      <div class=\"row\" style=\"margin-top:13px\">\n        <input class=\"fld sm\" id=\"nsName\" placeholder=\"Add a subject\" style=\"flex:1\">\n        <select class=\"fld sm\" id=\"nsLevel\" style=\"width:auto\"><option>HL<\u002Foption><option>SL<\u002Foption><\u002Fselect>\n        <button class=\"ghost sm\" id=\"addSubject\">Add<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"card\">\n      <h2>Fravær<\u002Fh2>\n      <div class=\"hint\">Danish gymnasium absence escalates in steps, and most students only find out where the lines are after they've crossed one.<\u002Fdiv>\n      <label class=\"lbl\">Current fraværsprocent<\u002Flabel>\n      <input type=\"range\" min=\"0\" max=\"20\" step=\"0.5\" id=\"fravR\">\n      <div class=\"spread\" style=\"font-size:11.5px;color:var(--muted);margin:-2px 0 14px\">\n        <span>0%<\u002Fspan><span id=\"fravTxt\" style=\"font-weight:600\"><\u002Fspan><span>20%<\u002Fspan>\n      <\u002Fdiv>\n      <div id=\"fravState\"><\u002Fdiv>\n      <div class=\"callout hot\" style=\"margin-top:14px;font-size:13px\">\n        <b>The part nobody tells you:<\u002Fb> a written assignment handed in late without arranging it first is usually registered as <b>absence<\u002Fb>, not just a late grade. Your afleveringer and your fraværsprocent are the same number.\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════════════ SCHOOL SCHEDULE ═══════════════ -->\n<section id=\"s-classes\">\n  <div class=\"card\">\n    <h2>Your week at school<\u002Fh2>\n    <div class=\"hint\">The lessons that repeat every week, so Compass knows when you are actually free. Everything you plan sits in the gaps between these — and the Ask tab can read this and add to it when you tell it to.<\u002Fdiv>\n    <div class=\"row\" style=\"gap:8px;flex-wrap:wrap\">\n      <select class=\"fld sm\" id=\"clDay\" style=\"flex:0 0 7.5rem\"><\u002Fselect>\n      <input class=\"fld sm\" id=\"clFrom\" placeholder=\"08:10\" inputmode=\"numeric\" style=\"flex:0 0 5.5rem\" maxlength=\"5\">\n      <input class=\"fld sm\" id=\"clTo\" placeholder=\"09:40\" inputmode=\"numeric\" style=\"flex:0 0 5.5rem\" maxlength=\"5\">\n      <input class=\"fld sm\" id=\"clSubj\" placeholder=\"Chemistry HL\" style=\"flex:1 1 10rem\">\n      <input class=\"fld sm\" id=\"clRoom\" placeholder=\"Room (optional)\" style=\"flex:0 0 8.5rem\">\n      <button class=\"ghost sm\" id=\"clAdd\" style=\"flex:none\">Add<\u002Fbutton>\n    <\u002Fdiv>\n    <div id=\"clMsg\" class=\"note\" style=\"display:none\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div id=\"clWeek\"><\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════════════ REVISE ═══════════════ -->\n<section id=\"s-revise\">\n  <div class=\"card\">\n    <h2>Due today<\u002Fh2>\n    <div class=\"hint\">Spaced retrieval. Rate how well it came back and the topic reschedules itself — solid ones stretch out to a month, shaky ones return tomorrow. Testing yourself beats rereading by a wide margin, and the gap grows the longer you leave it. <b>Only topics you've already started appear here<\u002Fb>, so this stays short.<\u002Fdiv>\n    <div id=\"revDue\"><\u002Fdiv>\n    <div class=\"legend\" style=\"margin-top:14px\">\n      <span>Rate 1 (blank) to 5 (solid) after you've actually tried to recall it — not while looking at your notes.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"card\">\n    <div class=\"spread\" style=\"margin-bottom:3px\">\n      <h2>Interleaved set<\u002Fh2>\n      <button class=\"ghost sm\" id=\"mixBtn\">Shuffle a new set<\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"hint\">Doing twenty questions on one technique trains you to apply a method you were already told to use. Exams don't tell you. Mixing types forces the identification step — the effect on a 30-day delayed test is roughly double.<\u002Fdiv>\n    <div id=\"mixOut\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"card\">\n    <h2>All topics<\u002Fh2>\n    <div class=\"hint\">Box 1 comes back tomorrow, box 5 in a month. Move something down by rating it low.<\u002Fdiv>\n    <div class=\"pills\" id=\"revFilter\"><\u002Fdiv>\n    <div id=\"revAll\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"g2\">\n    <div class=\"card\">\n      <h2>Past paper plan<\u002Fh2>\n      <div class=\"hint\">Counting back from late April 2027.<\u002Fdiv>\n      <div id=\"paperPlan\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"card\">\n      <h2>Command terms<\u002Fh2>\n      <div class=\"hint\">Marks lost to answering at the wrong depth are the cheapest marks in the exam to get back.<\u002Fdiv>\n      <table class=\"tbl\" id=\"cmdTable\"><\u002Ftable>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- The Tasks screen is gone: its inbox, buckets and stale list all live in the\n     To-do card on Today now, so there is one list instead of two. -->\n\n<!-- ═══════════════ GOALS ═══════════════ -->\n<section id=\"s-goals\">\n  <div class=\"card\">\n    <div class=\"spread\" style=\"align-items:flex-start\">\n      <h2>Goals<\u002Fh2>\n      <div class=\"row\" style=\"gap:5px;flex:none\"><button class=\"ghost sm\" id=\"goalSort\">Sort: deadline<\u002Fbutton><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"hint\">Three at most, on a 12-week horizon — long enough to matter, short enough that \"there's plenty of time\" is obviously false. Each goal carries a <b>lead measure<\u002Fb> (what you do weekly, which you control) and a <b>lag measure<\u002Fb> (the outcome, which you don't). Tracking only the outcome tells you you've failed after it's too late.<\u002Fdiv>\n    <div class=\"tiles\" id=\"goalStats\"><\u002Fdiv>\n    <div class=\"divider\"><\u002Fdiv>\n    <div class=\"eyebrow\">Add a goal<\u002Fdiv>\n    <div class=\"gform\">\n      <input class=\"fld sm\" id=\"newGoal\" placeholder=\"What you're committing to\">\n      <input class=\"fld sm\" id=\"newGoalCat\" placeholder=\"Area (School, Health…)\">\n      <input class=\"fld sm\" id=\"newGoalDue\" type=\"date\" title=\"Target date\">\n      <select class=\"fld sm\" id=\"newGoalPri\" style=\"width:auto\" title=\"Priority\">\n        <option value=\"hi\">High<\u002Foption><option value=\"md\" selected=\"\">Medium<\u002Foption><option value=\"lo\">Low<\u002Foption>\n      <\u002Fselect>\n    <\u002Fdiv>\n    <div class=\"row\" style=\"margin-top:9px\">\n      <button class=\"ghost\" id=\"addGoal\">Add goal<\u002Fbutton>\n      <span class=\"hint\" style=\"margin:0;font-size:11.5px\">Leave the date blank and you get a 12-week horizon by default. You'll be walked through WOOP straight after.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"card flat\" style=\"padding:0;background:none;border:0;box-shadow:none;margin-bottom:15px\">\n    <div class=\"pills\" style=\"margin:0\" id=\"goalFilter\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div id=\"goalCards\"><\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════════════ RITUALS ═══════════════ -->\n<section id=\"s-rituals\">\n  <div class=\"card\">\n    <div class=\"callout\">\n      <b>Why scripts beat willpower.<\u002Fb> Every decision you make in the morning spends something you need later. These exist so that at 07:00 you're following instructions rather than negotiating with yourself. Adjust them to your real life once — then stop adjusting them.\n    <\u002Fdiv>\n    <div class=\"row\">\n      <button class=\"ghost\" id=\"planBtn\">Run the daily plan<\u002Fbutton>\n      <button class=\"ghost\" id=\"shutBtn2\">Run the shutdown<\u002Fbutton>\n      <button class=\"ghost\" id=\"revBtn\">Run the Sunday review<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"g2\" id=\"ritualCards\"><\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════════════ CHECK-IN ═══════════════ -->\n<section id=\"s-checkin\">\n  <div class=\"cigrid\">\n    <div class=\"card\">\n      <div class=\"eyebrow\">Check-in · 20 seconds<\u002Fdiv>\n      <div class=\"hint\">Do this once a day, whenever you remember. The numbers feed the readiness score on Today and the sleep/mood charts on Week.<\u002Fdiv>\n      <div class=\"moodgrid\" id=\"moodGrid\"><\u002Fdiv>\n      <label class=\"lbl\">Sleep last night <span class=\"q\">— hours<\u002Fspan><\u002Flabel>\n      <input type=\"range\" min=\"3\" max=\"11\" step=\"0.5\" id=\"sleepR\">\n      <div class=\"spread\" style=\"font-size:11.5px;color:var(--muted);margin:-2px 0 14px\">\n        <span>3h<\u002Fspan><span id=\"sleepTxt\" style=\"color:var(--ink-2);font-weight:600\"><\u002Fspan><span>11h<\u002Fspan>\n      <\u002Fdiv>\n      <label class=\"lbl\">Energy right now<\u002Flabel>\n      <input type=\"range\" min=\"1\" max=\"5\" id=\"energyR\">\n      <div class=\"spread\" style=\"font-size:11.5px;color:var(--muted);margin:-2px 0 0\">\n        <span>Empty<\u002Fspan><span id=\"energyTxt\" style=\"color:var(--ink-2);font-weight:600\"><\u002Fspan><span>Full<\u002Fspan>\n      <\u002Fdiv>\n      <details class=\"why\">\n        <summary>Why naming it helps<\u002Fsummary>\n        <div class=\"src\">Naming a feeling precisely measurably reduces its intensity. Pick the closest word.<\u002Fdiv>\n      <\u002Fdetails>\n    <\u002Fdiv>\n\n    <div class=\"card\">\n      <h2 style=\"font-size:15.5px;margin-bottom:10px\">Anchors<\u002Fh2>\n      <div class=\"hint\" id=\"anchorHint\">Five fixed points that hold the day's shape. Deliberately small — these are the ones you keep on your worst days.<\u002Fdiv>\n      <div class=\"anchors\" id=\"anchors\"><\u002Fdiv>\n      <details class=\"why\">\n        <summary>Why five, and why these five<\u002Fsummary>\n        <div class=\"src\">Anchors are the floor, not the ceiling. On a good day you will do far more than this; on a bad one these five are the whole assignment, and doing them still counts as a day you showed up.<\u002Fdiv>\n      <\u002Fdetails>\n    <\u002Fdiv>\n\n    <div class=\"card\">\n      <div class=\"eyebrow\">Evening · 5 minutes<\u002Fdiv>\n      <div class=\"spread\" style=\"margin-bottom:12px\">\n        <h2 style=\"font-size:15px\">Shutdown<\u002Fh2>\n        <button class=\"ghost sm\" id=\"shutBtn\">Run the ritual<\u002Fbutton>\n      <\u002Fdiv>\n      <label class=\"lbl\">One thing that went right<\u002Flabel>\n      <textarea class=\"fld\" id=\"win\" placeholder=\"However small. Write something.\"><\u002Ftextarea>\n      <label class=\"lbl\" style=\"margin-top:13px\">Brain dump — everything still rattling around<\u002Flabel>\n      <textarea class=\"fld\" id=\"dump\" placeholder=\"One per line. Doesn't have to be organised.\"><\u002Ftextarea>\n      <div class=\"row\" style=\"margin-top:10px\">\n        <button class=\"ghost sm\" id=\"dumpToTasks\">Send each line to the inbox<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════════════ NOTES ═══════════════ -->\n<section id=\"s-notes\">\n  <div class=\"ntgrid\">\n  <div class=\"card\">\n    <div class=\"spread\" style=\"margin-bottom:3px\">\n      <h2>Questions &amp; notes<\u002Fh2>\n      <span class=\"chip\" id=\"ntCount\">—<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"hint\">One place per subject for the things you got wrong, the ones you had to look up, and the ones you know you will forget. Star the ones that matter most. <b>Marking one revised is not the same as reading it<\u002Fb> — cover the answer, try to say it, then rate yourself.<\u002Fdiv>\n\n    <div class=\"pills\" id=\"ntSubjects\"><\u002Fdiv>\n\n    <div class=\"ntform\">\n      <div class=\"row\" style=\"gap:8px;flex-wrap:wrap;margin-bottom:8px\">\n        <select class=\"fld sm\" id=\"ntSubj\" style=\"flex:1 1 11rem\"><\u002Fselect>\n        <select class=\"fld sm\" id=\"ntKind\" style=\"flex:0 0 9.5rem\">\n          <option value=\"q\">Question<\u002Foption>\n          <option value=\"n\">Note<\u002Foption>\n          <option value=\"m\">Mistake<\u002Foption>\n          <option value=\"f\">Formula / definition<\u002Foption>\n        <\u002Fselect>\n      <\u002Fdiv>\n      <input class=\"fld\" id=\"ntTitle\" placeholder=\"The question, or what the note is about\">\n      <textarea class=\"fld\" id=\"ntBody\" style=\"margin-top:8px\" placeholder=\"The answer, the working, or why you got it wrong. Optional — leaving it blank makes this a question you still owe yourself.\"><\u002Ftextarea>\n      <div class=\"row\" style=\"margin-top:9px\">\n        <button class=\"ghost\" id=\"ntAdd\">Save it<\u002Fbutton>\n        <span class=\"hint\" style=\"margin:0;font-size:11.5px\">Enter in the title box saves too.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"card\">\n    <div class=\"spread\" style=\"margin-bottom:3px\">\n      <h2>Saved<\u002Fh2>\n ck squat or goblet squat\",3,10,12,null,5,\"\",\"New — quad depth without heavy spinal load.\"),\n      E(\"Leg extension\",7,12,15,52,2.5,\"FST7\",\"\"),\n      E(\"RDL\",4,8,10,50,5,\"\",\"Only hinge you own. Brace hard — stop on any back pain.\"),\n      E(\"Lying leg curl\",7,12,15,50,2.5,\"FST7\",\"Hamstrings have been under-trained.\"),\n      E(\"Glute trainer\",3,12,15,48,2.5,\"\",\"\"),\n      E(\"Calf press\",4,12,15,72,5,\"DROP\",\"Pause and stretch at the bottom. Drop the last set.\"),\n      E(\"Hanging leg raise + crunch\",3,15,20,null,0,\"\",\"\")\n    ]}\n  ];\n}\nvar GYM_TECH = {\n  \"R-P\":\"Rest-pause — go to failure, rack it, breathe 15 s, squeeze out more. Twice.\",\n  \"DROP\":\"Drop set — hit failure, cut the load about 30%, go again with no rest.\",\n  \"FST7\":\"FST-7 — 7 sets, one weight, 30–45 s rest. Chase the pump, not the load.\"\n};\nfunction gCfg(){\n  if(!S.gym) S.gym={unit:\"kg\", prog:gDefaultProgram(), log:[], draft:null, v:5};\n  var G=S.gym;\n  if(!G.prog || !G.prog.length) G.prog=gDefaultProgram();\n  /* The first version shipped a generic PPL placeholder. Replace it with the\n     real programme — but only while it is still untouched and nothing has been\n     logged against it, so an edited plan or real history is never overwritten. */\n  if(G.v!==5 && !G.log.length && gIsStockOld(G.prog)){\n    G.prog=gDefaultProgram();\n    G.draft=null;                 // a half-filled draft from the old plan is meaningless now\n  }\n  if(!G.v) G.v=5;\n  if(!G.log) G.log=[];\n  if(!G.unit) G.unit=\"kg\";\n  return G;\n}\nfunction gIsStockOld(prog){\n  if(!prog || prog.length!==3) return false;\n  var names=prog.map(function(d){ return d.n; }).join(\"/\");\n  if(names!==\"Push/Pull/Legs\") return false;\n  var first=prog[0].ex[0];\n  return !!(first && first.n===\"Bench press\" && prog[0].ex.length===5);\n}\nfunction gDay(id){ return gCfg().prog.filter(function(d){ return d.id===id; })[0]; }\nfunction gNum(v){ v=parseFloat(v); return isFinite(v)&&v>=0 ? v : null; }\nfunction gFmtW(w){ return (Math.round(w*10)/10)+gCfg().unit; }\nfunction gSetStr(s){ return gFmtW(s.w)+\" × \"+s.r; }\n/* Epley. Only meaningful up to about 10 reps, so we don't show it past that. */\nfunction g1RM(w,r){ return (r>0 && r<=12) ? w*(1+r/30) : 0; }\n\n/* The last session that contained this exercise. */\nfunction gLast(name, beforeId){\n  var G=gCfg();\n  for(var i=G.log.length-1;i>=0;i--){\n    if(beforeId && G.log[i].id===beforeId) continue;\n    var hit=(G.log[i].ex||[]).filter(function(e){ return e.n===name && e.sets && e.sets.length; })[0];\n    if(hit) return {when:G.log[i].d, sets:hit.sets};\n  }\n  return null;\n}\nfunction gBest(name){\n  var G=gCfg(), best=null;\n  G.log.forEach(function(s){\n    (s.ex||[]).forEach(function(e){\n      if(e.n!==name) return;\n      (e.sets||[]).forEach(function(x){\n        var v=g1RM(x.w,x.r);\n        if(v && (!best || v>best.v)) best={v:v, w:x.w, r:x.r, d:s.d};\n      });\n    });\n  });\n  return best;\n}\n/* Double progression: clear the top of the range on every set, then add load. */\nfunction gSuggest(exDef){\n  var last=gLast(exDef.n), unit=gCfg().unit;\n  var startW=(exDef.w===null||exDef.w===undefined)?null:exDef.w;\n  var toFail=!exDef.hi;\n  var fst=exDef.tech===\"FST7\";\n\n  if(!last){\n    if(startW===null) return {kind:\"new\", w:null,\n      msg:toFail ? \"Bodyweight, both sets to failure.\"\n        : \"Calibrate this one — pick a weight you can control for \"+exDef.lo+\"–\"+exDef.hi+\" and write down what you used.\"};\n    return {kind:\"new\", w:startW,\n      msg:fst ? \"Programme says \"+startW+unit+\". Getting all \"+exDef.s+\" sets matters more than the load.\"\n        : \"Programme says \"+startW+unit+\".\"};\n  }\n  var done=last.sets.filter(function(s){ return s.r>0; });\n  if(!done.length) return {kind:\"new\", w:startW, msg:\"\"};\n  var top=done[0].w;\n\n  if(toFail) return {kind:\"hold\", w:top||null,\n    msg:\"Last time: \"+done.map(function(s){return s.r;}).join(\" and \")+\" reps. Beat one of them.\"};\n\n  /* FST-7 is pump work at a fixed load. Finish all seven sets before you touch\n     the weight — going up early is exactly how people fail to finish. */\n  if(fst){\n    if(done.length < exDef.s) return {kind:\"hold\", w:top,\n      msg:\"You got \"+done.length+\" of \"+exDef.s+\" sets last time. Same weight until all \"+exDef.s+\" are done.\"};\n    if(done.every(function(s){ return s.r>=exDef.hi; })) return {kind:\"up\", w:top+exDef.inc,\n      msg:\"All \"+exDef.s+\" sets at the top of the range. Small jump to \"+gFmtW(top+exDef.inc)+\".\"};\n    return {kind:\"hold\", w:top, msg:\"All \"+exDef.s+\" sets done. Hold \"+gFmtW(top)+\" and chase more reps.\"};\n  }\n\n  var allTop=done.length>=exDef.s && done.every(function(s){ return s.r>=exDef.hi; });\n  if(allTop) return {kind:\"up\", w:top+exDef.inc,\n    msg:\"You cleared \"+exDef.hi+\" on every set. Go up to \"+gFmtW(top+exDef.inc)+\" and expect to drop back to about \"+exDef.lo+\".\"};\n  if(done.some(function(s){ return s.r<exDef.lo; })) return {kind:\"hold\", w:top,\n    msg:\"You dropped below \"+exDef.lo+\" last time. Stay at \"+gFmtW(top)+\" until all \"+exDef.s+\" sets are back in range.\"};\n  return {kind:\"hold\", w:top, msg:\"Stay at \"+gFmtW(top)+\" and add a rep where you can.\"};\n}\n\n/* ── the draft: a workout in progress ── */\nfunction gStart(dayId){\n  var G=gCfg(), d=gDay(dayId);\n  if(!d) return;\n  G.draft={ dayId:dayId, n:d.n, at:Date.now(), d:iso(new Date()),\n    ex:d.ex.map(function(e){\n      var last=gLast(e.n), sg=gSuggest(e);\n      var w=(sg.w!=null)?sg.w:(last&&last.sets[0]?last.sets[0].w:(e.w!=null?e.w:null));\n      var sets=[];\n      for(var i=0;i<e.s;i++) sets.push({w:(w||w===0)?w:null, r:null});   // blank, not 0, on a lift you've never done\n      return {n:e.n, id:e.id, sets:sets};\n    }), note:\"\" };\n  touch(); renderGym();\n}\nfunction gDiscard(){ gCfg().draft=null; touch(); renderGym(); }\n/* If the prog
