[];\n  }\n  drawerOn = false; searchQ = \"\"; searchHits = [];\n  render();\n  setTimeout(function(){\n    var el = logEl() && logEl().querySelector('.turn[data-i=\"'+h.index+'\"]');\n    if(!el) return;\n    stick = false;\n    el.scrollIntoView({block:\"center\", behavior:\"smooth\"});\n    el.classList.add(\"found\");\n    setTimeout(function(){ el.classList.remove(\"found\"); }, 2200);\n  }, 60);\n}\n\n/* ── chat list drawer ───────────────────────────── */\nfunction renderDrawer(){\n  var d=$(\"#askDrawer\"); if(!d) return;\n  d.classList.toggle(\"on\", drawerOn);\n  if(!drawerOn) return;\n  var list=$(\"#askChatList\");\n\n  /* Searching replaces the conversation list rather than sitting beside it: the drawer is\n     narrow, and two scrolling regions in it would both be too short to use. */\n  if(searchQ.trim().length >= 2){\n    list.innerHTML = searchHTML();\n    return;\n  }\n  var real=chats.filter(function(c){ return c.messages.length || c===cur; });\n  list.innerHTML = real.length ? real.map(function(c){\n    var meta=(MODES[c.mode]?MODES[c.mode].label:\"Advise\")+(c.at?\" \\u00b7 \"+relTime(c.at):\"\");\n    return '<div class=\"chatrow'+(c===cur?\" on\":\"\")+'\">'\n      + '<button class=\"pick\" type=\"button\" data-chat=\"'+esc(c.id)+'\">'\n      +   '<span class=\"cn\">'+esc(titleFor(c))+'<\u002Fspan>'\n      +   '<span class=\"cm\">'+esc(meta)+'<\u002Fspan>'\n      + '<\u002Fbutton>'\n      + '<button class=\"x\" type=\"button\" data-dropchat=\"'+esc(c.id)+'\" aria-label=\"Delete this chat\">'+ICO.trash+'<\u002Fbutton>'\n      + '<\u002Fdiv>';\n  }).join(\"\") : '<div class=\"dempty\">No conversations yet.<\u002Fdiv>';\n}\n\n/* ── COMPUTER CONTROL, IN THE HEADER ─────────────────────────────────\n   A switch and a countdown, and while it is on, something impossible to miss.\n\n   The indicator is the part that carries the safety property. Everything else in this\n   feature is a control on what the agent may do; the indicator is the control on his\n   understanding of it, and it is the difference between \"I let it do that\" and \"why did\n   my mouse just move\". So it is a full-width bar with a live countdown and a stop\n   button, not a dot in a corner — the requirement was that he must never be unsure\n   whether the agent can move his mouse, and a subtle indicator fails that requirement\n   by being subtle.\n\n   State comes from Rust on a poll rather than from a local timer. See DECISIONS.md D24:\n   a page-side countdown keeps running after the grant has actually expired, which would\n   show an active bar over a dead grant, or worse the reverse. */\nvar pcTimer = null;\n\nfunction pcCanOffer(){\n  var A = agent();\n  return !!(A && A.pcWhyNot && !A.pcWhyNot(visionOn));\n}\n\nfunction pcBarHTML(){\n  var A = agent();\n  if(!A) return \"\";\n  var s = A.pcNow();\n  if(!s || !s.active) return \"\";\n  var mins = Math.floor(s.seconds_left/60), secs = s.seconds_left%60;\n  return '<div class=\"pcbar\" role=\"status\">'\n    + '<span class=\"pcdot\" aria-hidden=\"true\"><\u002Fspan>'\n    + '<b>Compass can move your mouse and type<\u002Fb>'\n    + '<span class=\"pcleft mono\">'+mins+':'+(secs<10?\"0\":\"\")+secs+'<\u002Fspan>'\n    + '<span class=\"pcsteps\">'+s.steps_used+' action'+(s.steps_used===1?\"\":\"s\")+'<\u002Fspan>'\n    + '<button type=\"button\" class=\"pcstop\" id=\"pcStop\">Stop now<\u002Fbutton>'\n    + '<span class=\"pchint\">or press Ctrl+Alt+Shift+Esc<\u002Fspan>'\n    + '<\u002Fdiv>';\n}\n\nfunction paintPcBar(){\n  var host = $(\"#askPcBar\");\n  if(!host) return;\n  var html = pcBarHTML();\n  if(host.innerHTML !== html) host.innerHTML = html;\n\n  var A = agent();\n  var live = !!(A && A.pcNow() && A.pcNow().active);\n  /* Poll only while it matters. A timer running all day to discover that a switch is\n     still off is a battery cost for nothing. */\n  if(live && !pcTimer){\n    pcTimer = setInterval(function(){\n      var A2 = agent();\n      if(!A2){ clearInterval(pcTimer); pcTimer=null; return; }\n      A2.pcPoll().then(function(){\n        paintPcBar();\n        if(!A2.pcNow().active){ clearInterval(pcTimer); pcTimer=null; render(); }\n      });\n    }, 1000);\n  }\n  if(!live && pcTimer){ clearInterval(pcTimer); pcTimer=null; }\n}\n\n/* The switch itself, in the settings card rather than the header row: turning it on is a\n   deliberate act and should take a moment's navigation, whereas turning it off is one\n   tap on the bar that is already on screen. Asymmetric on purpose. */\nfunction pcControlHTML(){\n  var A = agent();\n  if(!A) return \"\";\n  var why = A.pcWhyNot(visionOn);\n  var s = A.pcNow();\n\n  var head = '<h2 style=\"margin-top:18px\">Letting Compass use your computer<\u002Fh2>';\n  if(why){\n    return head + '<div class=\"hint\">'+esc(why)+'<\u002Fdiv>';\n  }\n  if(s && s.active){\n    return head\n      + '<div class=\"hint\">On for another '+Math.ceil(s.seconds_left/60)+' minute'\n      + (Math.ceil(s.seconds_left/60)===1?\"\":\"s\")+'. '+s.steps_used+' action'\n      + (s.steps_used===1?\"\":\"s\")+' used of '+(s.steps_used+s.steps_left)+'.<\u002Fdiv>'\n      + '<div class=\"row\" style=\"margin-top:10px\"><button class=\"ghost sm\" id=\"pcOff\">Switch it off<\u002Fbutton><\u002Fdiv>';\n  }\n  return head\n    + '<div class=\"hint\">Compass can see your screen already. This also lets it move the pointer, '\n    + 'click and type \\u2014 for 15 minutes, and it asks Windows before every click and every piece '\n    + 'of typing. It switches itself off when the time runs out, when Compass has been in the '\n    + 'background for a minute, or when you press <b>Ctrl+Alt+Shift+Esc<\u002Fb>. It is never remembered '\n    + 'between sessions.<br><br>Security and password windows are invisible to it and cannot be '\n    + 'clicked, and it will refuse to type anything that looks like a password, a card number or a '\n    + 'login code.<\u002Fdiv>'\n    + '<div class=\"row\" style=\"margin-top:10px\"><button class=\"primary sm\" id=\"pcOn\">Switch it on for 15 minutes<\u002Fbutton>'\n    + '<span id=\"pcMsg\" style=\"font-size:12px;color:var(--muted)\"><\u002Fspan><\u002Fdiv>';\n}\n\n/* ── UI ────────────────────────────────────────────── */\nfunction render(){\n  var conn = ready();\n  $(\"#askTitle\").textContent = cur ? titleFor(cur) : \"New chat\";\n  $(\"#askSub\").innerHTML = conn\n    ? '<span class=\"dot\"><\u002Fspan>'+esc(MODES[mode].label)\n      + (cfg.model ? \" \\u00b7 \"+esc(cfg.model) : \" \\u00b7 worker default\")\n      + (notionOn ? \" \\u00b7 Notion\" : \"\")\n    : '<span class=\"dot off\"><\u002Fspan>Not connected';\n\n  $(\"#askModes\").innerHTML = Object.keys(MODES).map(function(k){\n    return '<button type=\"button\" data-mode=\"'+k+'\" aria-pressed=\"'+(mode===k)+'\">'+esc(MODES[k].label)+'<\u002Fbutton>';\n  }).join(\"\");\n\n  $(\"#askSetup\").style.display = (conn && !showCfg) ? \"none\" : \"block\";\n  var cfgBtn=$(\"#askCfg\");\n  if(cfgBtn){ cfgBtn.setAttribute(\"aria-pressed\", String(!!showCfg)); }\n  var h=$(\"#askSetupH\"); if(h) h.textContent = conn ? \"Connection\" : \"Connect it first\";\n  var fg=$(\"#cfgForget\"); if(fg) fg.style.display = conn ? \"\" : \"none\";\n  $(\"#askFoot\").style.display = conn ? \"\" : \"none\";\n  $(\"#cfgUrl\").value = cfg.url || \"\";\n  $(\"#cfgSecret\").value = cfg.secret || \"\";\n  var sel=$(\"#cfgModel\");\n  if(sel && cfg.model && !Array.prototype.some.call(sel.options,function(o){return o.value===cfg.model;})){\n    var o=document.createElement(\"option\"); o.value=cfg.model; o.textContent=cfg.model; sel.appendChild(o);\n  }\n  if(sel) sel.value = cfg.model || \"\";\n\n  /* Which protocol is in use, and why, in the place where it can be changed.\n     Shown because a silent protocol decision is one nobody can debug: a false positive\n     from the probe once made every turn return nothing, with no error anywhere, and it\n     took a manual session and the provider's own request log to work out why. */\n  var ts = $(\"#cfgTools\");\n  if(ts) ts.value = cfg.tools || \"\";\n  var tw = $(\"#cfgToolsWhy\");\n  if(tw){\n    var state = NATIVE_TOOLS === null ? \"not checked yet\"\n              : NATIVE_TOOLS ? \"in use\" : \"not in use\";\n    tw.innerHTML = \"Native tool calling is <b>\"+esc(state)+\"<\u002Fb>\"\n      + (nativeWhy ? \" \\u2014 \"+esc(nativeWhy) : \"\")\n      + \". The fenced protocol works everywhere; this is only faster and more reliable where \"\n      + \"the provider genuinely supports it. Set it to <b>Never<\u002Fb> if replies come back empty.\";\n  }\n  var pcCtl = $(\"#askPcCtl\");\n  if(pcCtl) pcCtl.innerHTML = pcControlHTML();\n  paintPcBar();\n  renderDrawer();\n  setSend();\n  paint();\n}\n\n/* Stop generating.\n   Three things have to happen and only one of them used to. Aborting the fetch ends\n   the stream, but a turn is no longer just a stream: there may be lookups in flight\n   and a queue of steps behind them, and neither knows about an AbortController.\n\n   So the ledger is marked cancelled, which is the flag the read pool and the round\n   loop both consult. In-flight lookups are not killed — a folder walk already\n   underway will finish, because there is no way to interrupt a native call and\n   pretending otherwise would leave the step record lying about what happened — but\n   nothing new starts, and the results of anything that lands afterwards are\n   discarded rather than fed back to the model.\n\n   The transcript then says where it was cut. A turn that simply stops, with a\n   half-finished timeline and no sentence, is indistinguishable from a crash. */\nfunction stop(){\n  if(ctl){ try{ ctl.abort(); }catch(e){} ctl=null; }\n  var slot = history[history.length-1];\n  if(slot && slot.role === \"assistant\" && slot.ledger) slot.ledger.cancelled = true;\n  if(slot && slot.steps){\n    for(var i=0;i<slot.steps.length;i++){\n      /* A step that was mid-flight is neither done nor failed: it was abandoned,\n         and saying so is more honest than marking it either. */\n      if(slot.steps[i].state === \"running\" || slot.steps[i].state === \"pending\"){\n        slot.steps[i].state = \"failed\";\n        slot.steps[i].raw = slot.steps[i].raw || \"(stopped before this finished)\";\n        slot.steps[i].ms = slot.steps[i].ms || (Date.now() - slot.steps[i].at);\n      }\n    }\n  }\n  busy=false; setSend();\n}\nfunction setSend(){\n  var b=$(\"#askSend\"); if(!b) return;\n  var input=$(\"#askInput\");\n  b.classList.toggle(\"stop\", busy);\n  b.innerHTML = busy ? ICO.stop : ICO.send;\n  b.setAttribute(\"aria-label\", busy ? \"Stop generating\" : \"Send\");\n  b.disabled = !busy && !(input && input.value.trim()) && !atts.length;\n  var n=$(\"#askCount\");\n  if(n){\n    var len=input?input.value.length:0;\n    n.textContent = len>600 ? len+\" characters\" : \"\";\n  }\n}\nfunction grow(t){\n  if(!t) return;\n  t.style.height=\"auto\";\n  t.style.height=Math.min(190, Math.max(36, t.scrollHeight))+\"px\";\n}\n\nasync function send(text){\n  if(busy){ stop(); return; }\n  if(!ready()){ showCfg=true; render(); return; }\n  text=String(text||\"\").trim();\n  var pending=atts.filter(function(a){ return a.status===\"reading\"; }).length;\n  if(pending){ attNote(\"Still reading \"+pending+\" file\"+(pending>1?\"s\":\"\")+\" — one second.\"); return; }\n  var turn=buildTurn(text);\n  if(!text && !turn.chips.length) return;\n  editIx=null;\n  history.push({role:\"user\", content:text, api:turn.api, chips:turn.chips, at:Date.now()});\n  var box=$(\"#askInput\"); if(box){ box.value=\"\"; grow(box); }\n  atts=[]; paintAtts(); attNote(\"\");\n  await runTurn();\n}\n\n/* Throw away the last reply and ask the same question again. */\nfunction regen(){\n  if(busy) return;\n  while(history.length && history[history.length-1].role===\"assistant\") history.pop();\n  if(!history.length){ paint(); return; }\n  runTurn();\n}\n\nfunction startEdit(i){ if(!busy){ editIx=i; paint(); } }\n\n/* Continue from an earlier point without losing what came after.\n   Copies the conversation up to and including turn `i` into a new one and switches to\n   it, leaving the original untouched. This is the answer to \"regenerate an earlier\n   turn\", which would otherwise have to silently discard everything below it. */\nfunction branchFrom(i){\n  if(busy || !cur || i < 0 || i >= history.length) return;\n  var copy = history.slice(0, i+1).map(function(m){ return JSON.parse(JSON.stringify(slimMsg(m))); });\n  var c = {id:newId(), title:(cur.title||titleFor(cur))+\" \\u2014 branch\", mode:cur.mode,\n           at:Date.now(), messages:copy};\n  chats.unshift(c);\n  cur = c; history = c.messages; mode = c.mode;\n  atts = []; drawerOn = false;\n  saveChats(); render();\n  toast(\"Branched \\u2014 the original is still in your conversations\");\n}\n\n/* Remove one turn, and the reply that belongs to it.\n   A user turn takes its answer with it, because a question deleted from under an answer\n   leaves the answer talking to nobody — and the next turn would be sent a conversation\n   that does not make sense. */\nfunction deleteTurn(i){\n  if(busy || i < 0 || i >= history.length) return;\n  var n = 1;\n  if(history[i].role === \"user\" && history[i+1] && history[i+1].role === \"assistant\") n = 2;\n  history.splice(i, n);\n  saveChats(); paint();\n  toast(n === 2 ? \"Deleted the question and its answer\" : \"Deleted\");\n}\n\n/* The conversation as a file. Markdown for reading, JSON for keeping.\n   Downloaded rather than copied, because a long conversation is past what a clipboard is\n   comfortable with, and a file is what someone wants when they are keeping it. */\nfunction exportChat(kind){\n  if(!cur) return;\n  var name = (titleFor(cur) || \"compass-chat\").replace(/[^\\w\\- ]+/g, \"\").trim().slice(0,60) || \"compass-chat\";\n  var text, mime;\n  if(kind === \"json\"){\n    text = JSON.stringify({\n      exported: new Date().toISOString(),\n      title: titleFor(cur), mode: cur.mode,\n      messages: cur.messages.map(slimMsg)\n    }, null, 2);\n    mime = \"application/json\";\n    name += \".json\";\n  } else {\n    var out = [\"# \"+titleFor(cur), \"\", \"_\"+(MODES[cur.mode]?MODES[cur.mode].label:cur.mode)\n      + \" \\u00b7 exported \"+new Date().toLocaleString()+\"_\", \"\"];\n    cur.messages.forEach(function(m){\n      var who = m.role === \"user\" ? \"Navid\" : \"Compass\";\n      out.push(\"## \"+who+(m.at ? \" \\u00b7 \"+hhmm(m.at) : \"\"));\n      out.push(\"\");\n      out.push(rawOf(m) || \"_(nothing)_\");\n      if(m.chips && m.chips.length){\n        out.push(\"\");\n        out.push(\"_Attached: \"+m.chips.map(function(c){ return c.name; }).join(\", \")+\"_\");\n      }\n      if(m.acts){\n        out.push(\"\");\n        out.push(\"_Proposed \"+m.acts.length+\" change\"+(m.acts.length===1?\"\":\"s\")\n          + (m.result ? \", applied\" : m.undone ? \", discarded\" : \", not applied\")+\"._\");\n      }\n      if(m.sdrop) out.push(\"\", \"_\"+m.sdrop+\" tool step\"+(m.sdrop===1?\"\":\"s\")+\" ran._\");\n      out.push(\"\");\n    });\n    text = out.join(\"\\n\");\n    mime = \"text/markdown\";\n    name += \".md\";\n  }\n  try{\n    var blob = new Blob([text], {type:mime+\";charset=utf-8\"});\n    var url = URL.createObjectURL(blob);\n    var a = document.createElement(\"a\");\n    a.href = url; a.download = name;\n    document.body.appendChild(a); a.click();\n    document.body.removeChild(a);\n    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);\n    toast(\"Saved \"+name);\n  }catch(e){\n    toast(\"Couldn\\u2019t save the file\");\n  }\n}\nfunction saveEdit(i){\n  var t=$(\"#askEdit\"); if(!t) return;\n  var v=t.value.trim();\n  editIx=null;\n  if(!v || !history[i]){ paint(); return; }\n  history.length = i+1;                 // everything after the edited turn is stale\n  history[i].content = v;\n  history[i].at = Date.now();\n  runTurn();\n}\n\n/* One request/response cycle against whatever is at the end of the thread.\n   send, regenerate and edit all funnel through here so they behave alike.\n\n   This half owns the turn: it creates the assistant slot, marks the UI busy,\n   catches whatever escapes, and always tears down. The round loop is `orchestrate`\n   below. The split is what makes the loop something that can grow a step list, a\n   budget and a cancel path without this function growing with it. */\nasync function runTurn(){\n  history.push({role:\"assistant\", content:\"\", at:Date.now(), tag:MODES[mode].label});\n  stick=true; busy=true; touchChat(); render();\n\n  var slot = history[history.length-1];\n  ctl = new AbortController();\n\n  try{\n    /* Settle the protocol before the turn starts.\n       The probe used to be fired and not awaited, so its answer could arrive in the middle\n       of a conversation and change protocol between one message and the next — which is\n       exactly what it looked like when this went wrong: the first few turns worked, then\n       every one after came back empty. A turn should be answered by one protocol from\n       beginning to end, and the decision should be made before there is anything to\n       disturb.\n\n       Awaiting it is nearly always free: it is fired once when the connection is checked,\n       so by the time anyone has typed a message it has resolved. When it has not, waiting\n       for one small request is better than switching protocol underneath someone. */\n    if(NATIVE_TOOLS === null) await probeNativeTools();\n    await orchestrate(slot);\n  }catch(err){\n    if(err && err.name===\"AbortError\"){ if(!slot.content) slot.content=\"(stopped)\"; }\n    else {\n      slot.err=1;\n      slot.content = \"Couldn\\u2019t reach the worker. Check the URL in Settings and that you\\u2019re online.\\n\\n\"\n        + String(err&&err.message||err);\n    }\n  }\n  /* Say where it was cut, in the transcript rather than only on screen, so the\n     record of the conversation matches what happened. Which step it reached is the\n     useful part: \"stopped after 3 of 7\" tells him whether the work was half done,\n     and a later turn can read it back. */\n  if(slot.ledger && slot.ledger.cancelled){\n    var ran = 0, all = (slot.steps || []).length;\n    for(var s=0;s<all;s++){ if(slot.steps[s].state === \"done\") ran++; }\n    var where = all\n      ? \"Stopped after \"+ran+\" of \"+all+\" step\"+(all===1?\"\":\"s\")+\".\"\n      : \"Stopped before any lookups ran.\";\n    slot.body = (slot.body || streamBody(slot.content || \"\") || \"\").replace(/\\s+$/,\"\");\n    slot.body = (slot.body ? slot.body + \"\\n\\n\" : \"\") + \"_\"+where+\"_\";\n    slot.acts = null;\n  }\n  /* What the turn cost, kept on the message so it survives a repaint and a reload.\n     Assembled from the ledger, which has been counting all along — before this it was\n     counted and thrown away. */\n  if(slot.ledger){\n    slot.usage = {\n      rounds: slot.ledger.rounds,\n      steps: slot.ledger.steps,\n      tokens: slot.ledger.tokens,\n      ms: Date.now() - slot.ledger.at,\n      model: cfg.model || \"\",\n      vision: !!(visionOn && slot.usedVision),\n      proto: NATIVE_TOOLS ? \"tools\" : \"block\"\n    };\n  }\n  slot.reading=false;\n  busy=false; ctl=null;\n  setSend();\n  paint();\n  touchChat();\n}\n\n/* The look-then-think loop.\n   Each pass streams a reply, and if that reply asked for lookups, runs them and\n   feeds the results back as a synthetic user turn so the next pass can answer from\n   real data. `extra` carries those round-trips; they never appear in the visible\n   chat, only in what the model is told.\n\n   The loop is bounded by the ledger rather than by a round counter alone, so it can\n   say which budget ran out. When one does, the model gets one final pass with no\n   tools available and is told to answer from what it already has — stopping mid-job\n   with a spinner and no explanation is the worst of the available outcomes. */\nasync function orchestrate(slot){\n  /* `seen` count n       This used to end the turn, and it should not: an empty reply is never terminal while\n       there is another path to try. It is what a provider that ignored the `tools` field\n       produces, and the whole chat went silent that way once — a false positive from the\n       probe switched protocol mid-session and every subsequent turn returned nothing, with\n       no error anywhere to explain it.\n\n       So the first empty reply on the native path is treated as proof the probe was wrong.\n       Tool calling is switched off for the session, the reason is recorded where it can be\n       read, and the same round is attempted again on the fenced protocol. If that is also\n       empty, or if there was never a native path to abandon, one blind retry is allowed —\n       an empty stream is often transient — and only then does the turn give up, with a\n       message that says what was tried rather than pointing at a log file. */\n    if(!slot.content && !viaTools){\n      if(NATIVE_TOOLS && !slot.fellBack){\n        NATIVE_TOOLS = false;\n        nativeWhy = \"the provider accepted tool definitions and then returned nothing, so \"+\n                    \"Compass switched back to the fenced protocol mid-conversation\";\n        slot.fellBack = true;\n        slot.protoSwitched = true;\n        slot.calls = null;\n        continue;\n      }\n      if(!slot.fellBack){\n        slot.fellBack = true;\n        slot.calls = null;\n        continue;\n      }\n      slot.content = \"Nothing came back from the model, twice.\"\n        + (slot.protoSwitched\n            ? \" Compass also switched off native tool calling and tried again, which did not help.\"\n            : \"\")\n        + \" The request reached the worker, so this is the model or the provider behind it \"\n        + \"rather than your connection. Try again, or pick a different model in Settings.\";\n      slot.err=1;\n      return;\n    }\n    var spent = ledgerStop(L);\n\n    if(sp.acts && hasReads(sp
