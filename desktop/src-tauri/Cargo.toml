[package]
name = "compass-desktop"
version = "1.0.0"
description = "Compass — the desktop shell and native agent layer"
authors = ["Navid NJ"]
edition = "2021"
rust-version = "1.77"
# There is no library consumer; naming it keeps tauri's generated glue happy.
default-run = "compass-desktop"

# main.rs is a thin shim over this library, which is the layout tauri expects and
# what lets the same code serve a desktop binary and a mobile entry point.
[lib]
name = "compass_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["devtools"] }

# Native confirmation dialogs. These are the one prompt a compromised frontend
# cannot draw, skip or lie about, so every destructive tool goes through them.
tauri-plugin-dialog = "2.7.2"

# Used only from Rust, never exposed to the webview as a permission.
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-opener = "2.5.4"

# Native application updates, kept entirely separate from frontend updates.
#
# `native-tls` instead of the default `rustls-tls`, which means schannel — the TLS
# stack and certificate store Windows already uses. For a Windows-only app that is
# the better choice twice over: it honours whatever trust configuration the
# machine has (enterprise roots, corporate proxies), and it drops `rustls` and its
# `ring` C-and-assembly crypto library out of the tree entirely. Less bundled
# cryptography in a security-sensitive binary, and one fewer thing to keep patched.
tauri-plugin-updater = { version = "2.10.1", default-features = false, features = [
    "native-tls",
    "zip",
] }

# One window per machine, and it remembers where it was.
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-window-state = "2.4.1"

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Browser control, over the Chrome DevTools Protocol.
#
# Deliberately NOT `chromiumoxide` or `headless_chrome`. CDP is JSON-RPC over a
# WebSocket, and a full client would expose every method Chrome has. Hand-rolling
# the transport means exactly five methods are reachable from this app — the same
# reasoning as having no `execute_any_command`: the frontend cannot ask Chrome to
# do something that was never implemented here.
#
# reqwest and tokio are already in the tree via tauri and the updater, so the only
# genuinely new dependency is the WebSocket codec.
tokio-tungstenite = { version = "0.30.0", default-features = false, features = [
    "connect",
    "handshake",
] }
tokio = { version = "1.53.1", features = ["time", "process", "io-util", "net", "macros"] }
reqwest = { version = "0.13.4", default-features = false }
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }

# Read-only machine facts for get_system_information.
sysinfo = "0.39.6"

# Bounded recursive walking for search_files.
walkdir = "2.5.0"

# delete_file sends things to the Recycle Bin. Nothing here ever unlinks a file.
trash = "5.2.6"
pdf-extract = "0.12.0"
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }
quick-xml = "0.38"
rusqlite = { version = "0.37", features = ["bundled"] }
tauri-plugin-global-shortcut = "2"
xcap = "0.7"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_System_ProcessStatus"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"

# Stripping stays off, and this is not cosmetic.
#
# `tauri-utils` carries a `#[used] static mut __TAURI_BUNDLE_TYPE` marker that the
# bundler patches during packaging and the updater reads back at runtime to work
# out how this copy was installed. Strip the symbols and the marker goes with
# them, after which the build prints "Updater plugin may not be able to update
# this package" — a warning that is easy to skim past and whose consequence is
# every install silently unable to take an update.
#
# Verified by building both ways and searching the binary: the marker survives
# `lto = true` (the `#[used]` attribute is doing its job), so link-time
# optimisation stays on. It does not survive stripping.
strip = false
